name: packaged-artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/requirements-gaussian.txt
            engine/requirements-sdv.txt
            engine/requirements-build.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm run engine:install:packaged
      - run: pnpm run engine:check:packaged-deps
      - run: pnpm run check
      - run: pnpm run engine:test
      - run: pnpm run engine:build
      - run: pnpm run engine:binary-smoke
      - run: pnpm run build
      - name: Shorten pnpm dlx cache path on Windows
        if: runner.os == 'Windows'
        run: pnpm config set cache-dir "${{ runner.temp }}\pnpm-cache"
      - run: pnpm run package:desktop:dir
      - name: Smoke packaged Electron app
        if: runner.os == 'Windows'
        run: pnpm run package:desktop:smoke
      - name: Smoke packaged Electron app
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run package:desktop:smoke
      - run: pnpm run package:desktop:artifact
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
