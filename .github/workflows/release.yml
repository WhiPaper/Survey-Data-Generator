name: packaged-artifacts

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish packaged artifacts as a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run engine:install:packaged
      - run: pnpm run engine:check:packaged-deps
      - run: pnpm run check
      - run: pnpm run engine:test
      - run: pnpm run engine:build
      - run: pnpm run engine:binary-smoke
      - name: Require Google OAuth build credentials
        env:
          SURVEY_SYNTH_GOOGLE_CLIENT_ID: ${{ secrets.SURVEY_SYNTH_GOOGLE_CLIENT_ID }}
          SURVEY_SYNTH_GOOGLE_CLIENT_SECRET: ${{ secrets.SURVEY_SYNTH_GOOGLE_CLIENT_SECRET }}
        run: >-
          node -e "for (const name of ['SURVEY_SYNTH_GOOGLE_CLIENT_ID','SURVEY_SYNTH_GOOGLE_CLIENT_SECRET']) { if (!process.env[name]?.trim()) { console.error(name + ' GitHub Actions secret is required for packaged builds'); process.exit(1); } }"
      - name: Require Windows updater credential
        if: runner.os == 'Windows'
        env:
          SURVEY_SYNTH_UPDATE_GITHUB_TOKEN: ${{ secrets.SURVEY_SYNTH_UPDATE_GITHUB_TOKEN }}
        run: >-
          node -e "if (!process.env.SURVEY_SYNTH_UPDATE_GITHUB_TOKEN?.trim()) { console.error('SURVEY_SYNTH_UPDATE_GITHUB_TOKEN GitHub Actions secret is required for Windows packaged builds'); process.exit(1); }"
      - name: Build Windows Electron app with packaged credentials
        if: runner.os == 'Windows'
        env:
          SURVEY_SYNTH_GOOGLE_CLIENT_ID: ${{ secrets.SURVEY_SYNTH_GOOGLE_CLIENT_ID }}
          SURVEY_SYNTH_GOOGLE_CLIENT_SECRET: ${{ secrets.SURVEY_SYNTH_GOOGLE_CLIENT_SECRET }}
          SURVEY_SYNTH_UPDATE_GITHUB_TOKEN: ${{ secrets.SURVEY_SYNTH_UPDATE_GITHUB_TOKEN }}
        run: pnpm run build
      - name: Build Linux Electron app with Google OAuth client
        if: runner.os == 'Linux'
        env:
          SURVEY_SYNTH_GOOGLE_CLIENT_ID: ${{ secrets.SURVEY_SYNTH_GOOGLE_CLIENT_ID }}
          SURVEY_SYNTH_GOOGLE_CLIENT_SECRET: ${{ secrets.SURVEY_SYNTH_GOOGLE_CLIENT_SECRET }}
        run: pnpm run build
      - name: Shorten pnpm dlx cache path on Windows
        if: runner.os == 'Windows'
        run: pnpm config set cache-dir "${{ runner.temp }}\\pnpm-cache"
      - run: pnpm run package:desktop:dir
      - name: Smoke packaged Electron app
        if: runner.os == 'Windows'
        run: pnpm run package:desktop:smoke
      - name: Smoke packaged Electron app
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run package:desktop:smoke
      - run: pnpm run package:desktop:artifact
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  publish:
    name: github-release
    if: ${{ inputs.publish_release }}
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it"
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
