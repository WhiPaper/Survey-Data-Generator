name: ci-value-group-count-targets

on:
  pull_request:

permissions:
  contents: write

jobs:
  polish-and-check:
    if: github.head_ref == 'ui/value-group-count-targets'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Add ValueGroup count preview
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/src/QuestionExplorerPanel/index.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { targetKindForMode, targetModeAllowed } from "./targetModePolicy";\n',
              '''import {\n  resolvedCountForMode,\n  targetKindForMode,\n  targetModeAllowed,\n} from "./targetModePolicy";\n''',
          )
          replace_once(
              '''      : null;\n  const valueInvalid =\n''',
              '''      : null;\n  const resolvedCount =\n    activeMetric && Number.isFinite(parsedValue)\n      ? resolvedCountForMode(mode, activeMetric.count, parsedValue)\n      : null;\n  const valueInvalid =\n''',
          )
          replace_once(
              '''            {activeMetric && value !== "" && !valueInvalid ? (\n              <div className="space-y-1 text-sm">\n                <p className="font-medium tabular-nums">현재 {formatShare(activeMetric.share)}</p>\n                {resolvedShare !== null ? (\n                  <p className="tabular-nums text-muted-foreground">\n                    → 목표 {formatShare(resolvedShare)}\n                  </p>\n                ) : null}\n              </div>\n            ) : null}\n''',
              '''            {activeMetric && value !== "" && !valueInvalid ? (\n              <div className="space-y-1 text-sm">\n                {shareMode ? (\n                  <>\n                    <p className="font-medium tabular-nums">\n                      현재 {formatShare(activeMetric.share)}\n                    </p>\n                    {resolvedShare !== null ? (\n                      <p className="tabular-nums text-muted-foreground">\n                        → 목표 {formatShare(resolvedShare)}\n                      </p>\n                    ) : null}\n                  </>\n                ) : (\n                  <>\n                    <p className="font-medium tabular-nums">현재 {activeMetric.count}명</p>\n                    {resolvedCount !== null ? (\n                      <p className="tabular-nums text-muted-foreground">\n                        → 목표 {resolvedCount}명\n                      </p>\n                    ) : null}\n                  </>\n                )}\n              </div>\n            ) : null}\n''',
          )
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/desktop/src/QuestionExplorerPanel/index.tsx apps/desktop/src/QuestionExplorerPanel/targetModePolicy.ts apps/desktop/test/target-mode-policy.test.ts
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/desktop/src/QuestionExplorerPanel/index.tsx apps/desktop/src/QuestionExplorerPanel/targetModePolicy.ts apps/desktop/test/target-mode-policy.test.ts
            git commit -m "fix(ui): show ValueGroup count previews"
            git push origin HEAD:ui/value-group-count-targets
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
