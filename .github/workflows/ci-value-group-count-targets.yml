name: ci-value-group-count-targets

on:
  pull_request:

permissions:
  contents: write

jobs:
  wire-and-check:
    if: github.head_ref == 'ui/value-group-count-targets'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Wire ValueGroup count modes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/src/QuestionExplorerPanel/index.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { createDraftSaveCoordinator } from "./draftSaveCoordinator";\n',
              'import { createDraftSaveCoordinator } from "./draftSaveCoordinator";\nimport { targetKindForMode, targetModeAllowed } from "./targetModePolicy";\n',
          )
          replace_once('  const valueGroupMode = editing?.subjectKind === "value_group";\n', '')
          replace_once(
              '    ((conditionalMode || valueGroupMode) && !shareMode) ||\n',
              '    !targetModeAllowed(mode, conditionalMode) ||\n',
          )
          replace_once(
              '''    const shareOnly = valueGroupMode || conditionalMode;\n    const kind =\n      !shareOnly && (mode === "absolute_count" || mode === "count_delta") ? "count" : "share";\n''',
              '    const kind = targetKindForMode(mode);\n',
          )
          replace_once('                  {!conditionalMode && !valueGroupMode ? (\n', '                  {!conditionalMode ? (\n')
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/desktop/src/QuestionExplorerPanel/index.tsx apps/desktop/src/QuestionExplorerPanel/targetModePolicy.ts apps/desktop/test/target-mode-policy.test.ts
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/desktop/src/QuestionExplorerPanel/index.tsx apps/desktop/src/QuestionExplorerPanel/targetModePolicy.ts apps/desktop/test/target-mode-policy.test.ts
            git commit -m "fix(ui): enable ValueGroup count targets"
            git push origin HEAD:ui/value-group-count-targets
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
