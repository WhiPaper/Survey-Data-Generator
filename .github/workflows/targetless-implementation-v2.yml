name: targetless-generation-implementation-v2

on:
  push:
    branches:
      - product/targetless-generation

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/targetless-generation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply targetless generation slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"expected one match in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "apps/desktop/electron/main/targets/service.ts",
              '    if (draft.targets.length === 0) {\n      issues.push(targetIssue([], "domain_unsupported", "At least one target is required"));\n    }\n',
              '    if (\n      draft.targets.length === 0 &&\n      draft.finalCount !== null &&\n      draft.finalCount <= context.responses.length\n    ) {\n      issues.push(\n        targetIssue(\n          [],\n          "out_of_range",\n          "Targetless generation requires the final count to exceed the source response count",\n        ),\n      );\n    }\n',
          )

          replace_once(
              "apps/desktop/src/QuestionExplorerPanel/index.tsx",
              'import { editPlanOutcomeValue } from "./editPlanPresentation";\nimport { resolvedCountForMode, targetKindForMode, targetModeAllowed } from "./targetModePolicy";\n',
              'import { editPlanOutcomeValue } from "./editPlanPresentation";\nimport { generationBlockReason } from "./generationPolicy";\nimport { resolvedCountForMode, targetKindForMode, targetModeAllowed } from "./targetModePolicy";\n',
          )
          replace_once(
              "apps/desktop/src/QuestionExplorerPanel/index.tsx",
              '  const sourceCount = profile?.responseCount ?? project.responseCount;\n  const finalCount = draft.finalCount;\n  const finalCountInvalid = finalCount === null || finalCount < sourceCount;\n  const additions = finalCountInvalid || finalCount === null ? null : finalCount - sourceCount;\n',
              '  const sourceCount = profile?.responseCount ?? project.responseCount;\n  const finalCount = draft.finalCount;\n  const generationBlock = generationBlockReason({\n    sourceCount,\n    finalCount,\n    targetCount: draft.targets.length,\n  });\n  const finalCountInvalid = generationBlock === "final_count_below_source";\n  const noAdditionalResponses = generationBlock === "no_additions";\n  const additions = finalCountInvalid || finalCount === null ? null : finalCount - sourceCount;\n',
          )
          replace_once(
              "apps/desktop/src/QuestionExplorerPanel/index.tsx",
              '              {` · ${draft.targets.length > 0 ? `목표 ${draft.targets.length}개` : "목표 없음"}`}\n            </p>\n            <Button\n              type="button"\n              disabled={busy || finalCountInvalid || draft.targets.length === 0}\n',
              '              {` · ${draft.targets.length > 0 ? `목표 ${draft.targets.length}개` : "목표 없음"}`}\n              {noAdditionalResponses ? " · 추가로 생성할 응답이 없습니다." : ""}\n            </p>\n            <Button\n              type="button"\n              disabled={busy || generationBlock !== null}\n',
          )

          Path("apps/desktop/src/QuestionExplorerPanel/generationPolicy.ts").write_text(
              '''export type GenerationBlockReason = "final_count_below_source" | "no_additions" | null;

type GenerationPolicyInput = {
  sourceCount: number;
  finalCount: number | null;
  targetCount: number;
};

export const generationBlockReason = ({
  sourceCount,
  finalCount,
  targetCount,
}: GenerationPolicyInput): GenerationBlockReason => {
  if (finalCount === null || finalCount < sourceCount) return "final_count_below_source";
  if (targetCount === 0 && finalCount === sourceCount) return "no_additions";
  return null;
};
''',
              encoding="utf-8",
          )

          replace_once(
              "apps/desktop/src/QuestionExplorerPanel/resultDiagnostics.ts",
              'export const resultSourceScopeLabel = (scope: SourceScope): string =>\n  scope.kind === "all" ? "전체 응답" : `${datePart(scope.start)} ~ ${datePart(scope.end)}`;\n\nexport const resultDiagnosticsLines = (run: RunsGetResult): string[] => {\n',
              'export const resultSourceScopeLabel = (scope: SourceScope): string =>\n  scope.kind === "all" ? "전체 응답" : `${datePart(scope.start)} ~ ${datePart(scope.end)}`;\n\nexport const resultTargetNotice = (run: Pick<RunsGetResult, "outcome">): string | null =>\n  run.outcome.targets.length === 0 ? "설정한 분포 목표가 없습니다." : null;\n\nexport const resultDiagnosticsLines = (run: RunsGetResult): string[] => {\n',
          )
          replace_once(
              "apps/desktop/src/QuestionExplorerPanel/ResultView.tsx",
              'import { resultDiagnosticsLines } from "./resultDiagnostics";\n',
              'import { resultDiagnosticsLines, resultTargetNotice } from "./resultDiagnostics";\n',
          )
          replace_once(
              "apps/desktop/src/QuestionExplorerPanel/ResultView.tsx",
              '  if (!context) {\n    return (\n      <div className="mx-auto max-w-[850px] px-8 py-10">\n        <p className="text-sm text-muted-foreground">아직 생성한 결과가 없습니다.</p>\n      </div>\n    );\n  }\n\n  return (\n',
              '  if (!context) {\n    return (\n      <div className="mx-auto max-w-[850px] px-8 py-10">\n        <p className="text-sm text-muted-foreground">아직 생성한 결과가 없습니다.</p>\n      </div>\n    );\n  }\n\n  const targetNotice = resultTargetNotice(context.run);\n\n  return (\n',
          )
          replace_once(
              "apps/desktop/src/QuestionExplorerPanel/ResultView.tsx",
              '      <div className="divide-y">\n        {context.run.outcome.targets.map((outcome) => {\n',
              '      <div className="divide-y">\n        {targetNotice ? (\n          <p className="py-5 text-sm text-muted-foreground">{targetNotice}</p>\n        ) : null}\n        {context.run.outcome.targets.map((outcome) => {\n',
          )

          phase4 = Path("apps/desktop/test/phase4-targets.test.ts")
          phase4_text = phase4.read_text(encoding="utf-8")
          insertion = '''

  it("starts a targetless draft when the final count adds responses", async () => {
    const database = setup();
    let captured: SynthesisStartParams | null = null;
    const service = createTargetService(
      database.db,
      captureSynthesis((params) => {
        captured = params;
      }),
    );
    const input: TargetDraft = {
      projectId: "project-1",
      finalCount: 4,
      sourceScope: { kind: "all" },
      seed: 42,
      targets: [],
    };

    await expect(service.saveDraft(input)).resolves.toMatchObject(input);
    await expect(service.validate(input)).resolves.toEqual({ issues: [] });
    await service.startDraft("project-1", "targetless-test");

    expect(captured).toMatchObject({
      projectId: "project-1",
      finalCount: 4,
      sourceScope: { kind: "all" },
      operationId: "targetless-test",
      targets: [],
      targetIntents: [],
    });
  });

  it("does not start a targetless draft when there are no responses to add", async () => {
    const database = setup();
    let captured: SynthesisStartParams | null = null;
    const service = createTargetService(
      database.db,
      captureSynthesis((params) => {
        captured = params;
      }),
    );
    const input: TargetDraft = {
      projectId: "project-1",
      finalCount: 2,
      sourceScope: { kind: "all" },
      seed: 42,
      targets: [],
    };

    await service.saveDraft(input);
    await expect(service.startDraft("project-1")).resolves.toMatchObject({
      status: "infeasible",
      issues: [
        {
          targetIds: [],
          code: "out_of_range",
          message: "Targetless generation requires the final count to exceed the source response count",
        },
      ],
    });
    expect(captured).toBeNull();
  });'''
          closing = "\n});\n"
          index = phase4_text.rfind(closing)
          if index < 0:
              raise RuntimeError("phase4 test closing block not found")
          phase4.write_text(phase4_text[:index] + insertion + phase4_text[index:], encoding="utf-8")

          Path("apps/desktop/test/question-explorer-generation-policy.test.ts").write_text(
              '''import { describe, expect, it } from "vitest";

import { generationBlockReason } from "../src/QuestionExplorerPanel/generationPolicy";

describe("Question Explorer generation policy", () => {
  it("allows targetless generation when the final count adds responses", () => {
    expect(generationBlockReason({ sourceCount: 184, finalCount: 300, targetCount: 0 })).toBeNull();
  });

  it("blocks a targetless no-op with a dedicated reason", () => {
    expect(generationBlockReason({ sourceCount: 184, finalCount: 184, targetCount: 0 })).toBe(
      "no_additions",
    );
  });

  it("preserves existing target-based generation at the source count", () => {
    expect(generationBlockReason({ sourceCount: 184, finalCount: 184, targetCount: 1 })).toBeNull();
  });

  it("keeps final counts below the source count invalid", () => {
    expect(generationBlockReason({ sourceCount: 184, finalCount: 183, targetCount: 0 })).toBe(
      "final_count_below_source",
    );
  });
});
''',
              encoding="utf-8",
          )

          Path("apps/desktop/test/result-target-notice.test.ts").write_text(
              '''import { describe, expect, it } from "vitest";

import { resultTargetNotice } from "../src/QuestionExplorerPanel/resultDiagnostics";

describe("targetless Result notice", () => {
  it("shows the planned empty-target copy", () => {
    expect(resultTargetNotice({ outcome: { targets: [] } })).toBe(
      "설정한 분포 목표가 없습니다.",
    );
  });

  it("does not add a notice when target outcomes exist", () => {
    expect(
      resultTargetNotice({
        outcome: {
          targets: [
            {
              targetId: "t-1" as never,
              kind: "count",
              requested: 2,
              achieved: 2,
              absoluteError: 0,
              exact: true,
              numeratorCount: 2,
            },
          ],
        },
      }),
    ).toBeNull();
  });
});
''',
              encoding="utf-8",
          )

          Path("engine/test_targetless_generation.py").write_text(
              '''from __future__ import annotations

import json
import tempfile
import unittest
from pathlib import Path

import pandas as pd

from main import run_synthesize


class TargetlessGenerationEngineTest(unittest.TestCase):
    def test_targetless_generation_adds_rows_without_public_target_outcomes(self) -> None:
        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            pd.DataFrame(
                {
                    "response_id": ["r1", "r2", "r3", "r4"],
                    "q_0": ["A", "B", "A", "B"],
                }
            ).to_parquet(root / "source.parquet")
            (root / "job.json").write_text(
                json.dumps(
                    {
                        "protocol_version": 1,
                        "kind": "synthesize",
                        "source_parquet": "source.parquet",
                        "result_parquet": "result.parquet",
                        "report_json": "report.json",
                        "final_count": 6,
                        "mean_targets": [],
                        "count_targets": [],
                        "share_targets": [],
                        "conditional_share_targets": [],
                        "seed": 17,
                        "id_column": "response_id",
                        "categorical_columns": ["q_0"],
                        "candidate_pool_size": 30,
                    }
                ),
                encoding="utf-8",
            )

            report = run_synthesize(root / "job.json")

            self.assertEqual(report["status"], "success")
            self.assertEqual(report["sourceCount"], 4)
            self.assertEqual(report["syntheticCount"], 2)
            self.assertEqual(report["finalCount"], 6)
            self.assertEqual(report["achieved"]["means"], [])
            self.assertEqual(report["achieved"]["counts"], [])
            self.assertEqual(report["achieved"]["shares"], [])
            self.assertEqual(report["achieved"]["conditionalShares"], [])


if __name__ == "__main__":
    unittest.main()
''',
              encoding="utf-8",
          )
          PY
      - run: pnpm install --frozen-lockfile
      - name: Format changed renderer and tests
        run: >-
          pnpm exec prettier --write
          apps/desktop/electron/main/targets/service.ts
          apps/desktop/src/QuestionExplorerPanel/index.tsx
          apps/desktop/src/QuestionExplorerPanel/generationPolicy.ts
          apps/desktop/src/QuestionExplorerPanel/ResultView.tsx
          apps/desktop/src/QuestionExplorerPanel/resultDiagnostics.ts
          apps/desktop/test/phase4-targets.test.ts
          apps/desktop/test/question-explorer-generation-policy.test.ts
          apps/desktop/test/result-target-notice.test.ts
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/electron/main/targets/service.ts \
            apps/desktop/src/QuestionExplorerPanel/index.tsx \
            apps/desktop/src/QuestionExplorerPanel/generationPolicy.ts \
            apps/desktop/src/QuestionExplorerPanel/ResultView.tsx \
            apps/desktop/src/QuestionExplorerPanel/resultDiagnostics.ts \
            apps/desktop/test/phase4-targets.test.ts \
            apps/desktop/test/question-explorer-generation-policy.test.ts \
            apps/desktop/test/result-target-notice.test.ts \
            engine/test_targetless_generation.py
          git commit -m "feat: support targetless generation"
          git push origin HEAD:product/targetless-generation
