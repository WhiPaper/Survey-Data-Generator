name: ci-edit-plan-outcome-units

on:
  pull_request:

permissions:
  contents: write

jobs:
  wire-and-check:
    if: github.head_ref == 'ui/edit-plan-outcome-units'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Wire replacement preview units
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/src/QuestionExplorerPanel/index.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { createDraftSaveCoordinator } from "./draftSaveCoordinator";\n',
              'import { createDraftSaveCoordinator } from "./draftSaveCoordinator";\nimport { editPlanOutcomeValue } from "./editPlanPresentation";\n',
          )
          replace_once(
              '''                        원본 유지 {appendOutcome.achieved.toFixed(3)} · 대체{" "}\n                        {replacementOutcome ? replacementOutcome.achieved.toFixed(3) : "—"}\n''',
              '''                        원본 유지 {editPlanOutcomeValue(appendOutcome)} · 대체{" "}\n                        {editPlanOutcomeValue(replacementOutcome)}\n''',
          )
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/desktop/src/QuestionExplorerPanel/index.tsx apps/desktop/src/QuestionExplorerPanel/editPlanPresentation.ts apps/desktop/test/edit-plan-presentation.test.ts
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/desktop/src/QuestionExplorerPanel/index.tsx apps/desktop/src/QuestionExplorerPanel/editPlanPresentation.ts apps/desktop/test/edit-plan-presentation.test.ts
            git commit -m "fix(ui): format replacement preview outcomes"
            git push origin HEAD:ui/edit-plan-outcome-units
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
