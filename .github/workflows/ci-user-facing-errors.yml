name: ci-user-facing-errors

on:
  pull_request:

permissions:
  contents: write

jobs:
  wire-and-check:
    if: github.head_ref == 'ui/user-facing-errors'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Wire user-facing error copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/src/QuestionExplorerPanel/index.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { questionPopulationText } from "./questionPopulation";\n',
              'import { questionPopulationText } from "./questionPopulation";\nimport { questionExplorerErrorMessage } from "./userFacingError";\n',
          )

          replacements = [
              ('setError(cause instanceof Error ? cause.message : "설정을 불러오지 못했습니다.");', 'setError(questionExplorerErrorMessage(cause, "load_workspace"));'),
              ('setError(cause instanceof Error ? cause.message : "변경사항을 저장하지 못했습니다.");', 'setError(questionExplorerErrorMessage(cause, "save_draft"));'),
              ('setError(cause instanceof Error ? cause.message : "분포를 다시 불러오지 못했습니다.");', 'setError(questionExplorerErrorMessage(cause, "reload_distribution"));'),
              ('setError(cause instanceof Error ? cause.message : "응답 값을 불러오지 못했습니다.");', 'setError(questionExplorerErrorMessage(cause, "load_text_values"));'),
              ('setError(cause instanceof Error ? cause.message : "그룹을 저장하지 못했습니다.");', 'setError(questionExplorerErrorMessage(cause, "save_group"));'),
              ('setError(cause instanceof Error ? cause.message : "그룹을 삭제하지 못했습니다.");', 'setError(questionExplorerErrorMessage(cause, "delete_group"));'),
              ('setError(cause instanceof Error ? cause.message : "결과를 불러오지 못했습니다.");', 'setError(questionExplorerErrorMessage(cause, "load_result"));'),
              ('setError(cause instanceof Error ? cause.message : "응답을 생성하지 못했습니다.");', 'setError(questionExplorerErrorMessage(cause, "generate"));'),
              ('setError(cause instanceof Error ? cause.message : "생성을 완료하지 못했습니다.");', 'setError(questionExplorerErrorMessage(cause, "complete_generation"));'),
              ('setError(cause instanceof Error ? cause.message : "결과를 내보내지 못했습니다.");', 'setError(questionExplorerErrorMessage(cause, "export_result"));'),
          ]
          for old, new in replacements:
              replace_once(old, new)

          if 'cause.message' in text:
              raise SystemExit('raw cause.message remains in QuestionExplorerPanel/index.tsx')

          path.write_text(text)
          PY
          pnpm exec prettier --write apps/desktop/src/QuestionExplorerPanel/index.tsx apps/desktop/src/QuestionExplorerPanel/userFacingError.ts apps/desktop/test/question-explorer-user-facing-error.test.ts
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/desktop/src/QuestionExplorerPanel/index.tsx apps/desktop/src/QuestionExplorerPanel/userFacingError.ts apps/desktop/test/question-explorer-user-facing-error.test.ts
            git commit -m "fix(ui): hide technical question explorer errors"
            git push origin HEAD:ui/user-facing-errors
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
