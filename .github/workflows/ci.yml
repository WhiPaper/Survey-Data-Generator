name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - phase1-backend-target-contract

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Implement local source review status
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement in {path}: {old[:160]!r}")
              file.write_text(text.replace(old, new, 1))

          protocol = "packages/contracts/src/protocol.ts"
          replace(
              protocol,
              '''export type ProjectSourceRefreshResult = z.infer<typeof ProjectSourceRefreshResultSchema>;\n\nexport const SynthesisSuccessResultSchema''',
              '''export type ProjectSourceRefreshResult = z.infer<typeof ProjectSourceRefreshResultSchema>;\n\nexport const ProjectSourceReviewResultSchema = z\n  .object({\n    projectId: ProjectIdSchema,\n    sourceRevisionId: z.string().min(1),\n    invalidValueGroupIds: z.array(z.string().min(1)),\n    targetIssues: z.array(TargetIssueSchema),\n  })\n  .strict();\nexport type ProjectSourceReviewResult = z.infer<typeof ProjectSourceReviewResultSchema>;\n\nexport const SynthesisSuccessResultSchema''',
          )
          replace(
              protocol,
              '''  "projects.get": { input: z.infer<typeof ProjectParamsSchema>; output: ProjectDetailView | null };\n  "projects.refreshSource": {''',
              '''  "projects.get": { input: z.infer<typeof ProjectParamsSchema>; output: ProjectDetailView | null };\n  "projects.sourceReview": {\n    input: z.infer<typeof ProjectParamsSchema>;\n    output: ProjectSourceReviewResult;\n  };\n  "projects.refreshSource": {''',
          )
          replace(
              protocol,
              '''  "projects.list",\n  "projects.get",\n  "projects.refreshSource",''',
              '''  "projects.list",\n  "projects.get",\n  "projects.sourceReview",\n  "projects.refreshSource",''',
          )
          replace(
              protocol,
              '''  "projects.list": EmptyParamsSchema,\n  "projects.get": ProjectParamsSchema,\n  "projects.refreshSource": ProjectSourceRefreshParamsSchema,''',
              '''  "projects.list": EmptyParamsSchema,\n  "projects.get": ProjectParamsSchema,\n  "projects.sourceReview": ProjectParamsSchema,\n  "projects.refreshSource": ProjectSourceRefreshParamsSchema,''',
          )
          replace(
              protocol,
              '''  "projects.list": z.array(ProjectSummarySchema),\n  "projects.get": ProjectDetailSchema.nullable(),\n  "projects.refreshSource": ProjectSourceRefreshResultSchema,''',
              '''  "projects.list": z.array(ProjectSummarySchema),\n  "projects.get": ProjectDetailSchema.nullable(),\n  "projects.sourceReview": ProjectSourceReviewResultSchema,\n  "projects.refreshSource": ProjectSourceRefreshResultSchema,''',
          )

          value_groups = "apps/desktop/electron/main/value-groups/service.ts"
          replace(
              value_groups,
              '''export const invalidValueGroupIdsForForm = (\n  db: SurveyDatabase,\n  projectId: string,\n  form: FormSnapshot,\n): string[] =>\n  db\n    .select()\n    .from(valueGroups)\n    .where(eq(valueGroups.projectId, projectId))\n    .all()\n    .flatMap((row) => {\n      const question = form.questions.find((candidate) => candidate.id === row.questionId);\n      if (!question || (question.kind !== "single_choice" && question.kind !== "text")) {\n        return [row.id];\n      }\n      if (question.kind === "single_choice") {\n        const allowed = new Set(question.options.map((option) => String(option.key)));\n        if (parseMembers(row.membersJson).some((member) => !allowed.has(member))) return [row.id];\n      }\n      return [];\n    });\n\nconst response''',
              '''export const invalidValueGroupIdsForForm = (\n  db: SurveyDatabase,\n  projectId: string,\n  form: FormSnapshot,\n): string[] =>\n  db\n    .select()\n    .from(valueGroups)\n    .where(eq(valueGroups.projectId, projectId))\n    .all()\n    .flatMap((row) => {\n      const question = form.questions.find((candidate) => candidate.id === row.questionId);\n      if (!question || (question.kind !== "single_choice" && question.kind !== "text")) {\n        return [row.id];\n      }\n      if (question.kind === "single_choice") {\n        const allowed = new Set(question.options.map((option) => String(option.key)));\n        if (parseMembers(row.membersJson).some((member) => !allowed.has(member))) return [row.id];\n      }\n      return [];\n    });\n\nexport const invalidValueGroupIdsForCurrentSource = (\n  db: SurveyDatabase,\n  projectId: string,\n): { sourceRevisionId: string; invalidValueGroupIds: string[] } => {\n  const { form, revisionId } = loadCurrentForm(db, projectId);\n  return {\n    sourceRevisionId: revisionId,\n    invalidValueGroupIds: invalidValueGroupIdsForForm(db, projectId, form),\n  };\n};\n\nconst response''',
          )

          projects = "apps/desktop/electron/main/projects/service.ts"
          replace(
              projects,
              '''} from "../persistence/store";\n\nexport interface ProjectService {''',
              '''} from "../persistence/store";\nimport { invalidValueGroupIdsForCurrentSource } from "../value-groups/service";\n\nexport interface ProjectService {''',
          )
          replace(
              projects,
              '''  get(projectId: string): Promise<ProjectDetailView | null>;\n  delete(projectId: string): Promise<void>;''',
              '''  get(projectId: string): Promise<ProjectDetailView | null>;\n  sourceReview(projectId: string): Promise<{\n    sourceRevisionId: string;\n    invalidValueGroupIds: string[];\n  }>;\n  delete(projectId: string): Promise<void>;''',
          )
          replace(
              projects,
              '''  delete: async (projectId) => {''',
              '''  sourceReview: async (projectId) => invalidValueGroupIdsForCurrentSource(db, projectId),\n\n  delete: async (projectId) => {''',
          )

          backend = "apps/desktop/electron/main/backend.ts"
          replace(
              backend,
              '''    case "projects.get":\n      return requireProjects(services).get((request.params as { projectId: string }).projectId);\n    case "projects.refreshSource": {''',
              '''    case "projects.get":\n      return requireProjects(services).get((request.params as { projectId: string }).projectId);\n    case "projects.sourceReview": {\n      const projectId = (request.params as { projectId: string }).projectId;\n      const source = await requireProjects(services).sourceReview(projectId);\n      const targetService = requireTargets(services);\n      const draft = await targetService.getDraft(projectId);\n      const targetIssues = draft\n        ? [\n            ...semanticDuplicateTargetIssues(draft.targets),\n            ...(await targetService.validate(draft)).issues,\n          ]\n        : [];\n      return {\n        projectId,\n        sourceRevisionId: source.sourceRevisionId,\n        invalidValueGroupIds: source.invalidValueGroupIds,\n        targetIssues,\n      };\n    }\n    case "projects.refreshSource": {''',
          )

          api = "apps/desktop/src/api/backend.ts"
          replace(
              api,
              '''  type ProjectDetailView,\n  type ProjectSourceRefreshResult,\n  type ProjectSummaryView,''',
              '''  type ProjectDetailView,\n  type ProjectSourceRefreshResult,\n  type ProjectSourceReviewResult,\n  type ProjectSummaryView,''',
          )
          replace(
              api,
              '''export const refreshProjectSource = (''',
              '''export const getProjectSourceReview = (\n  projectId: string,\n  backend?: BackendInvoker,\n): Promise<ProjectSourceReviewResult> =>\n  callBackend("projects.sourceReview", { projectId }, backend);\nexport const refreshProjectSource = (''',
          )

          shell = "apps/desktop/src/AppShell.tsx"
          replace(
              shell,
              '''  ProjectDetailView,\n  ProjectSourceRefreshResult,\n  ProjectSummaryView,''',
              '''  ProjectDetailView,\n  ProjectSourceReviewResult,\n  ProjectSummaryView,''',
          )
          replace(
              shell,
              '''  getProject,\n  getSession,''',
              '''  getProject,\n  getProjectSourceReview,\n  getSession,''',
          )
          replace(
              shell,
              '''  const [sourceReview, setSourceReview] = useState<ProjectSourceRefreshResult | null>(null);''',
              '''  const [sourceReview, setSourceReview] = useState<ProjectSourceReviewResult | null>(null);''',
          )
          replace(
              shell,
              '''    try {\n      setSourceReview(null);\n      setSelectedProject(await getProject(projectId));\n    } catch''',
              '''    try {\n      setSourceReview(null);\n      const [project, review] = await Promise.all([\n        getProject(projectId),\n        getProjectSourceReview(projectId),\n      ]);\n      setSelectedProject(project);\n      setSourceReview(review);\n    } catch''',
          )
          replace(
              shell,
              '''      setSelectedProject(result.project);\n      setSourceReview(result);\n      setProjects(await listProjects());''',
              '''      setSelectedProject(result.project);\n      setSourceReview({\n        projectId: result.project.id,\n        sourceRevisionId: result.sourceRevisionId,\n        invalidValueGroupIds: result.invalidValueGroupIds,\n        targetIssues: result.targetIssues,\n      });\n      setProjects(await listProjects());''',
          )
          replace(
              shell,
              '''              현재 문항과 응답을 다시 가져와 새 원본 버전으로 적용합니다. 이전 원본과 생성 결과는\n              그대로 보존되며, 저장한 그룹과 목표도 자동으로 바꾸지 않습니다.''',
              '''              현재 문항과 응답을 다시 가져와 새 원본 버전으로 적용합니다. Google Forms의 문항과\n              응답 자체는 변경하지 않습니다. 이전 원본과 생성 결과는 그대로 보존됩니다.''',
          )

          explorer = "apps/desktop/src/QuestionExplorerPanel/index.tsx"
          replace(
              explorer,
              '''  ProjectDetailView,\n  ProjectSourceRefreshResult,\n  RunSummary,''',
              '''  ProjectDetailView,\n  ProjectSourceReviewResult,\n  RunSummary,''',
          )
          replace(
              explorer,
              '''  sourceReview?: ProjectSourceRefreshResult | null;''',
              '''  sourceReview?: ProjectSourceReviewResult | null;''',
          )
          replace(
              explorer,
              '''            {sourceReviewCount > 0 ? (\n              <Button\n                type="button"\n                size="sm"\n                variant="outline"\n                className="h-8 text-destructive"\n                onClick={() => setSourceReviewOpen(true)}\n              >\n                확인 필요 {sourceReviewCount}\n              </Button>\n            ) : sourceReview ? (\n              <span className="text-xs text-muted-foreground">원본 업데이트 확인 완료</span>\n            ) : null}''',
              '''            {sourceReviewCount > 0 ? (\n              <Button\n                type="button"\n                size="sm"\n                variant="outline"\n                className="h-8 text-destructive"\n                onClick={() => setSourceReviewOpen(true)}\n              >\n                확인 필요 {sourceReviewCount}\n              </Button>\n            ) : null}''',
          )

          protocol_test = "packages/contracts/test/protocol.test.ts"
          replace(
              protocol_test,
              '''    expect(\n      parseRpcResult("projects.refreshSource", {''',
              '''    expect(\n      parseRpcRequest({\n        v: VERSIONS.protocolVersion,\n        type: "request",\n        id: "review-source",\n        method: "projects.sourceReview",\n        params: { projectId: "project-1" },\n      }),\n    ).toMatchObject({ method: "projects.sourceReview" });\n\n    expect(\n      parseRpcResult("projects.sourceReview", {\n        projectId: "project-1",\n        sourceRevisionId: "revision-2",\n        invalidValueGroupIds: ["group-1"],\n        targetIssues: [\n          {\n            targetIds: ["target-1"],\n            code: "invalid_subject",\n            message: "Target subject is not valid for this Form",\n          },\n        ],\n      }),\n    ).toMatchObject({\n      projectId: "project-1",\n      sourceRevisionId: "revision-2",\n      invalidValueGroupIds: ["group-1"],\n      targetIssues: [{ code: "invalid_subject" }],\n    });\n\n    expect(\n      parseRpcResult("projects.refreshSource", {''',
          )

          project_test = "apps/desktop/test/project-service.test.ts"
          replace(
              project_test,
              '''  it("deletes a project and its persisted source graph", async () => {''',
              '''  it("recomputes source review status from the current local revision", async () => {\n    const database = createDatabase();\n    seedImportedProject(database);\n    const service = createProjectService({ db: database.db });\n\n    await expect(service.sourceReview("project-1")).resolves.toEqual({\n      sourceRevisionId: "revision-1",\n      invalidValueGroupIds: [],\n    });\n  });\n\n  it("deletes a project and its persisted source graph", async () => {''',
          )

          backend_test = "apps/desktop/test/electron-backend.test.ts"
          replace(
              backend_test,
              '''      get: async (_projectId: string) => null,\n      delete: remove,''',
              '''      get: async (_projectId: string) => null,\n      sourceReview: async (_projectId: string) => ({\n        sourceRevisionId: "revision-1",\n        invalidValueGroupIds: [],\n      }),\n      delete: remove,''',
          )
          PY
      - name: Format local source review status
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/protocol.ts \
            packages/contracts/test/protocol.test.ts \
            apps/desktop/electron/main/value-groups/service.ts \
            apps/desktop/electron/main/projects/service.ts \
            apps/desktop/electron/main/backend.ts \
            apps/desktop/src/api/backend.ts \
            apps/desktop/src/AppShell.tsx \
            apps/desktop/src/QuestionExplorerPanel/index.tsx \
            apps/desktop/test/project-service.test.ts \
            apps/desktop/test/electron-backend.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add \
              packages/contracts/src/protocol.ts \
              packages/contracts/test/protocol.test.ts \
              apps/desktop/electron/main/value-groups/service.ts \
              apps/desktop/electron/main/projects/service.ts \
              apps/desktop/electron/main/backend.ts \
              apps/desktop/src/api/backend.ts \
              apps/desktop/src/AppShell.tsx \
              apps/desktop/src/QuestionExplorerPanel/index.tsx \
              apps/desktop/test/project-service.test.ts \
              apps/desktop/test/electron-backend.test.ts
            git commit -m "feat(source): restore local review status"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
