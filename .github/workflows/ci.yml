name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - phase1-backend-target-contract

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Apply question explorer type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path("apps/desktop/src/QuestionExplorerPanel/model.ts")
          text = model.read_text()
          text = text.replace(
              '  if ("valueGroupId" in target.subject) {\n    return groups.find((group) => group.id === target.subject.valueGroupId)?.questionId ?? null;\n  }\n  return target.subject.questionId;',
              '  const subject = target.subject;\n  if (subject.kind === "value_group") {\n    return groups.find((group) => group.id === subject.valueGroupId)?.questionId ?? null;\n  }\n  return subject.questionId;',
          )
          text = text.replace(
              '  if ("valueGroupId" in target.subject) {\n    return groups.find((group) => group.id === target.subject.valueGroupId)?.name ?? "그룹";\n  }\n  const question = questions.find((candidate) => candidate.id === target.subject.questionId);\n  return (\n    question?.options.find((option) => option.key === target.subject.optionKey)?.label ?? "선택지"\n  );',
              '  const subject = target.subject;\n  if (subject.kind === "value_group") {\n    return groups.find((group) => group.id === subject.valueGroupId)?.name ?? "그룹";\n  }\n  const question = questions.find((candidate) => candidate.id === subject.questionId);\n  return question?.options.find((option) => option.key === subject.optionKey)?.label ?? "선택지";',
          )
          text = text.replace(
              '  const metric =\n    "valueGroupId" in target.subject\n      ? valueGroupMetric(profile, target.subject.valueGroupId)\n      : subjectMetricFor(\n          profile,\n          target.subject.kind,\n          target.subject.questionId,\n          target.subject.optionKey,\n        );',
              '  const subject = target.subject;\n  const metric =\n    subject.kind === "value_group"\n      ? valueGroupMetric(profile, subject.valueGroupId)\n      : subjectMetricFor(profile, subject.kind, subject.questionId, subject.optionKey);',
          )
          model.write_text(text)
          PY
      - name: Format question explorer
        run: |
          pnpm exec prettier --write "apps/desktop/src/QuestionExplorerPanel/*.{ts,tsx}"
          if ! git diff --quiet -- apps/desktop/src/QuestionExplorerPanel; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/desktop/src/QuestionExplorerPanel
            git commit -m "fix(ui): narrow target subjects safely"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test