name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - phase1-backend-target-contract

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Apply source refresh completion boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("apps/desktop/src/AppShell.tsx")
          text = app.read_text()
          old_import = 'import { QuestionExplorerPanel } from "./QuestionExplorerPanel";\n'
          new_import = old_import + 'import { recoverAppliedSourceRefresh } from "./sourceRefreshRecovery";\n'
          if old_import not in text:
              raise SystemExit("AppShell import anchor missing")
          text = text.replace(old_import, new_import, 1)

          old = '''  const handleRefreshProject = async (): Promise<void> => {\n    if (!selectedProject) return;\n    setRefreshBusy(true);\n    setError(null);\n    try {\n      const result = await refreshProjectSource(selectedProject.id, `source-refresh-${Date.now()}`);\n      setSelectedProject(result.project);\n      setSourceReview({\n        projectId: result.project.id,\n        sourceRevisionId: result.sourceRevisionId,\n        invalidValueGroupIds: result.invalidValueGroupIds,\n        targetIssues: result.targetIssues,\n      });\n      setProjects(await listProjects());\n      setRefreshDialogOpen(false);\n    } catch (cause: unknown) {\n      setError(errorMessage(cause));\n    } finally {\n      setRefreshBusy(false);\n    }\n  };'''
          new = '''  const handleRefreshProject = async (): Promise<void> => {\n    if (!selectedProject) return;\n    const previousSourceRevisionId = selectedProject.currentSourceRevisionId;\n    setRefreshBusy(true);\n    setError(null);\n    try {\n      const result = await refreshProjectSource(selectedProject.id, `source-refresh-${Date.now()}`);\n      setSelectedProject(result.project);\n      setSourceReview({\n        projectId: result.project.id,\n        sourceRevisionId: result.sourceRevisionId,\n        invalidValueGroupIds: result.invalidValueGroupIds,\n        targetIssues: result.targetIssues,\n      });\n      setRefreshDialogOpen(false);\n      try {\n        setProjects(await listProjects());\n      } catch {\n        setError("원본은 업데이트됐지만 프로젝트 목록을 새로고치지 못했습니다.");\n      }\n    } catch (cause: unknown) {\n      const recovery = await recoverAppliedSourceRefresh({\n        projectId: selectedProject.id,\n        previousSourceRevisionId,\n        getProject,\n        getSourceReview: getProjectSourceReview,\n      });\n      if (recovery.status === "applied") {\n        setSelectedProject(recovery.project);\n        setSourceReview(recovery.review);\n        setRefreshDialogOpen(false);\n        let listReloadFailed = false;\n        try {\n          setProjects(await listProjects());\n        } catch {\n          listReloadFailed = true;\n        }\n        setError(\n          recovery.review === null\n            ? "원본은 업데이트됐지만 확인할 설정 상태를 불러오지 못했습니다."\n            : listReloadFailed\n              ? "원본은 업데이트됐지만 프로젝트 목록을 새로고치지 못했습니다."\n              : null,\n        );\n      } else {\n        setError(errorMessage(cause));\n      }\n    } finally {\n      setRefreshBusy(false);\n    }\n  };'''
          if old not in text:
              raise SystemExit("AppShell refresh handler anchor missing")
          app.write_text(text.replace(old, new, 1))

          Path("apps/desktop/src/sourceRefreshRecovery.ts").write_text('''import type {\n  ProjectDetailView,\n  ProjectSourceReviewResult,\n} from "@survey-synth/contracts";\n\ntype RecoveryDependencies = {\n  getProject(projectId: string): Promise<ProjectDetailView | null>;\n  getSourceReview(projectId: string): Promise<ProjectSourceReviewResult>;\n};\n\nexport type SourceRefreshRecovery =\n  | { status: "not_applied" }\n  | {\n      status: "applied";\n      project: ProjectDetailView;\n      review: ProjectSourceReviewResult | null;\n    };\n\nexport const recoverAppliedSourceRefresh = async ({\n  projectId,\n  previousSourceRevisionId,\n  getProject,\n  getSourceReview,\n}: {\n  projectId: string;\n  previousSourceRevisionId: ProjectDetailView["currentSourceRevisionId"];\n} & RecoveryDependencies): Promise<SourceRefreshRecovery> => {\n  let project: ProjectDetailView | null;\n  try {\n    project = await getProject(projectId);\n  } catch {\n    return { status: "not_applied" };\n  }\n\n  if (\n    project === null ||\n    project.currentSourceRevisionId === null ||\n    project.currentSourceRevisionId === previousSourceRevisionId\n  ) {\n    return { status: "not_applied" };\n  }\n\n  try {\n    return {\n      status: "applied",\n      project,\n      review: await getSourceReview(projectId),\n    };\n  } catch {\n    return { status: "applied", project, review: null };\n  }\n};\n''')

          Path("apps/desktop/test/source-refresh-recovery.test.ts").write_text('''import { describe, expect, it, vi } from "vitest";\n\nimport type { ProjectDetailView, ProjectSourceReviewResult } from "@survey-synth/contracts";\nimport { recoverAppliedSourceRefresh } from "../src/sourceRefreshRecovery";\n\nconst projectAt = (revisionId: string): ProjectDetailView =>\n  ({\n    id: "project-1",\n    currentSourceRevisionId: revisionId,\n  }) as ProjectDetailView;\n\nconst reviewAt = (revisionId: string): ProjectSourceReviewResult =>\n  ({\n    projectId: "project-1",\n    sourceRevisionId: revisionId,\n    invalidValueGroupIds: [],\n    targetIssues: [],\n  }) as ProjectSourceReviewResult;\n\ndescribe("source refresh recovery", () => {\n  it("does not infer an applied refresh when the current revision did not change", async () => {\n    const getSourceReview = vi.fn(async () => reviewAt("revision-1"));\n    await expect(\n      recoverAppliedSourceRefresh({\n        projectId: "project-1",\n        previousSourceRevisionId: "revision-1",\n        getProject: async () => projectAt("revision-1"),\n        getSourceReview,\n      }),\n    ).resolves.toEqual({ status: "not_applied" });\n    expect(getSourceReview).not.toHaveBeenCalled();\n  });\n\n  it("keeps an advanced revision and retries local review", async () => {\n    const review = reviewAt("revision-2");\n    await expect(\n      recoverAppliedSourceRefresh({\n        projectId: "project-1",\n        previousSourceRevisionId: "revision-1",\n        getProject: async () => projectAt("revision-2"),\n        getSourceReview: async () => review,\n      }),\n    ).resolves.toEqual({\n      status: "applied",\n      project: projectAt("revision-2"),\n      review,\n    });\n  });\n\n  it("keeps an advanced revision when local review is still unavailable", async () => {\n    await expect(\n      recoverAppliedSourceRefresh({\n        projectId: "project-1",\n        previousSourceRevisionId: "revision-1",\n        getProject: async () => projectAt("revision-2"),\n        getSourceReview: async () => {\n          throw new Error("review unavailable");\n        },\n      }),\n    ).resolves.toEqual({\n      status: "applied",\n      project: projectAt("revision-2"),\n      review: null,\n    });\n  });\n\n  it("preserves the original failure when local Project state cannot be read", async () => {\n    await expect(\n      recoverAppliedSourceRefresh({\n        projectId: "project-1",\n        previousSourceRevisionId: "revision-1",\n        getProject: async () => {\n          throw new Error("project unavailable");\n        },\n        getSourceReview: async () => reviewAt("revision-2"),\n      }),\n    ).resolves.toEqual({ status: "not_applied" });\n  });\n});\n''')
          PY
      - name: Format source refresh completion boundary
        run: |
          pnpm exec prettier --write \
            apps/desktop/src/AppShell.tsx \
            apps/desktop/src/sourceRefreshRecovery.ts \
            apps/desktop/test/source-refresh-recovery.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add \
              apps/desktop/src/AppShell.tsx \
              apps/desktop/src/sourceRefreshRecovery.ts \
              apps/desktop/test/source-refresh-recovery.test.ts
            git commit -m "fix(ui): preserve applied source refresh"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
