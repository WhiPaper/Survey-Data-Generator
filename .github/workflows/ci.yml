name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - phase1-backend-target-contract

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Wire explicit source refresh workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement in {path}: {old[:160]!r}")
              file.write_text(text.replace(old, new, 1))

          api = "apps/desktop/src/api/backend.ts"
          replace(
              api,
              '''  type ProjectDetailView,\n  type ProjectSummaryView,\n  type RpcMethod,''',
              '''  type ProjectDetailView,\n  type ProjectSourceRefreshResult,\n  type ProjectSummaryView,\n  type RpcMethod,''',
          )
          replace(
              api,
              '''export const getProject = (\n  projectId: string,\n  backend?: BackendInvoker,\n): Promise<ProjectDetailView | null> => callBackend("projects.get", { projectId }, backend);\nexport const deleteProject''',
              '''export const getProject = (\n  projectId: string,\n  backend?: BackendInvoker,\n): Promise<ProjectDetailView | null> => callBackend("projects.get", { projectId }, backend);\nexport const refreshProjectSource = (\n  projectId: string,\n  operationId?: string,\n  backend?: BackendInvoker,\n): Promise<ProjectSourceRefreshResult> =>\n  callBackend(\n    "projects.refreshSource",\n    { projectId, ...(operationId === undefined ? {} : { operationId }) },\n    backend,\n  );\nexport const deleteProject''',
          )

          shell = "apps/desktop/src/AppShell.tsx"
          replace(
              shell,
              '''  ProjectDetailView,\n  ProjectSummaryView,\n  SessionView,''',
              '''  ProjectDetailView,\n  ProjectSourceRefreshResult,\n  ProjectSummaryView,\n  SessionView,''',
          )
          replace(
              shell,
              '''  pingBackend,\n} from "./api/backend";\nimport { Button } from "@/components/ui/button";''',
              '''  pingBackend,\n  refreshProjectSource,\n} from "./api/backend";\nimport { Button } from "@/components/ui/button";\nimport {\n  Dialog,\n  DialogContent,\n  DialogDescription,\n  DialogFooter,\n  DialogHeader,\n  DialogTitle,\n} from "@/components/ui/dialog";''',
          )
          replace(
              shell,
              '''  const [projectsBusy, setProjectsBusy] = useState(false);\n  const [formsBusy, setFormsBusy] = useState(false);''',
              '''  const [projectsBusy, setProjectsBusy] = useState(false);\n  const [sourceReview, setSourceReview] = useState<ProjectSourceRefreshResult | null>(null);\n  const [refreshDialogOpen, setRefreshDialogOpen] = useState(false);\n  const [refreshBusy, setRefreshBusy] = useState(false);\n  const [formsBusy, setFormsBusy] = useState(false);''',
          )
          replace(
              shell,
              '''      setProjects([]);\n      setSelectedProject(null);\n      return;''',
              '''      setProjects([]);\n      setSelectedProject(null);\n      setSourceReview(null);\n      setRefreshDialogOpen(false);\n      return;''',
          )
          replace(
              shell,
              '''    try {\n      setSelectedProject(await getProject(projectId));\n    } catch''',
              '''    try {\n      setSourceReview(null);\n      setSelectedProject(await getProject(projectId));\n    } catch''',
          )
          replace(
              shell,
              '''  const handleDeleteProject = async (project: ProjectSummaryView): Promise<void> => {''',
              '''  const handleRefreshProject = async (): Promise<void> => {\n    if (!selectedProject) return;\n    setRefreshBusy(true);\n    setError(null);\n    try {\n      const result = await refreshProjectSource(\n        selectedProject.id,\n        `source-refresh-${Date.now()}`,\n      );\n      setSelectedProject(result.project);\n      setSourceReview(result);\n      setProjects(await listProjects());\n      setRefreshDialogOpen(false);\n    } catch (cause: unknown) {\n      setError(errorMessage(cause));\n    } finally {\n      setRefreshBusy(false);\n    }\n  };\n\n  const handleDeleteProject = async (project: ProjectSummaryView): Promise<void> => {''',
          )
          replace(
              shell,
              '''            <Button size="sm" variant="outline" onClick={() => setSelectedProject(null)}>\n              프로젝트 변경\n            </Button>''',
              '''            <div className="flex items-center gap-2">\n              <Button\n                size="sm"\n                variant="outline"\n                disabled={refreshBusy}\n                onClick={() => setRefreshDialogOpen(true)}\n              >\n                원본 업데이트\n              </Button>\n              <Button size="sm" variant="outline" onClick={() => setSelectedProject(null)}>\n                프로젝트 변경\n              </Button>\n            </div>''',
          )
          replace(
              shell,
              '''          <QuestionExplorerPanel project={selectedProject} />''',
              '''          <QuestionExplorerPanel project={selectedProject} sourceReview={sourceReview} />''',
          )
          replace(
              shell,
              '''      {error ? (\n        <p''',
              '''      <Dialog open={refreshDialogOpen} onOpenChange={setRefreshDialogOpen}>\n        <DialogContent className="sm:max-w-[520px]">\n          <DialogHeader>\n            <DialogTitle>Google Forms 원본을 업데이트할까요?</DialogTitle>\n            <DialogDescription>\n              현재 문항과 응답을 다시 가져와 새 원본 버전으로 적용합니다. 이전 원본과 생성 결과는\n              그대로 보존되며, 저장한 그룹과 목표도 자동으로 바꾸지 않습니다.\n            </DialogDescription>\n          </DialogHeader>\n          <p className="text-sm text-muted-foreground">\n            바뀐 문항이나 선택지 때문에 확인이 필요한 설정이 생기면 업데이트 후 작업공간에\n            표시됩니다.\n          </p>\n          <DialogFooter>\n            <Button\n              type="button"\n              variant="outline"\n              disabled={refreshBusy}\n              onClick={() => setRefreshDialogOpen(false)}\n            >\n              취소\n            </Button>\n            <Button type="button" disabled={refreshBusy} onClick={() => void handleRefreshProject()}>\n              {refreshBusy ? "가져오는 중…" : "업데이트"}\n            </Button>\n          </DialogFooter>\n        </DialogContent>\n      </Dialog>\n\n      {error ? (\n        <p''',
          )

          text_inspector = "apps/desktop/src/QuestionExplorerPanel/TextInspector.tsx"
          replace(
              text_inspector,
              '''  busy: boolean;\n  onOpenTarget:''',
              '''  busy: boolean;\n  invalidGroupIds: readonly string[];\n  onOpenTarget:''',
          )
          replace(
              text_inspector,
              '''  busy,\n  onOpenTarget,''',
              '''  busy,\n  invalidGroupIds,\n  onOpenTarget,''',
          )
          replace(
              text_inspector,
              '''              const target = subjectTarget(targets, editing);\n              const overlapCount =''',
              '''              const target = subjectTarget(targets, editing);\n              const needsReview = invalidGroupIds.includes(group.id);\n              const overlapCount =''',
          )
          replace(
              text_inspector,
              '''                      <span className="truncate text-sm font-medium">{group.name}</span>''',
              '''                      <span className="flex min-w-0 items-center gap-2 text-sm font-medium">\n                        <span className="truncate">{group.name}</span>\n                        {needsReview ? (\n                          <span className="shrink-0 text-xs font-normal text-destructive">\n                            확인 필요\n                          </span>\n                        ) : null}\n                      </span>''',
          )

          explorer = "apps/desktop/src/QuestionExplorerPanel/index.tsx"
          replace(
              explorer,
              '''  ProjectDetailView,\n  RunSummary,''',
              '''  ProjectDetailView,\n  ProjectSourceRefreshResult,\n  RunSummary,''',
          )
          replace(
              explorer,
              '''  startTargetDraft,\n} from "../api/backend";''',
              '''  startTargetDraft,\n  validateTargetDraft,\n} from "../api/backend";''',
          )
          replace(
              explorer,
              '''export function QuestionExplorerPanel({ project }: { project: ProjectDetailView }) {''',
              '''export function QuestionExplorerPanel({\n  project,\n  sourceReview,\n}: {\n  project: ProjectDetailView;\n  sourceReview?: ProjectSourceRefreshResult | null;\n}) {''',
          )
          replace(
              explorer,
              '''  const [deleteBlockedGroup, setDeleteBlockedGroup] = useState<ValueGroupView | null>(null);\n  const [issues, setIssues] = useState<TargetIssue[]>([]);''',
              '''  const [deleteBlockedGroup, setDeleteBlockedGroup] = useState<ValueGroupView | null>(null);\n  const [sourceReviewOpen, setSourceReviewOpen] = useState(false);\n  const [sourceTargetIssues, setSourceTargetIssues] = useState<TargetIssue[]>(\n    sourceReview?.targetIssues ?? [],\n  );\n  const [issues, setIssues] = useState<TargetIssue[]>([]);''',
          )
          replace(
              explorer,
              '''  const selectedQuestion =\n    questions.find((question) => question.id === selectedQuestionId) ?? questions[0];\n\n  const reloadGroups''',
              '''  const selectedQuestion =\n    questions.find((question) => question.id === selectedQuestionId) ?? questions[0];\n  const activeReviewGroups = (sourceReview?.invalidValueGroupIds ?? [])\n    .map((groupId) => groups.find((group) => group.id === groupId))\n    .filter((group): group is ValueGroupView => group !== undefined);\n  const activeReviewTargetIssues = sourceTargetIssues.filter(\n    (issue) =>\n      issue.targetIds.length === 0 ||\n      issue.targetIds.some((issueTargetId) =>\n        draft.targets.some((target) => String(target.id) === String(issueTargetId)),\n      ),\n  );\n  const sourceReviewCount = activeReviewGroups.length + activeReviewTargetIssues.length;\n  const reviewQuestionIds = useMemo(() => {\n    const ids = new Set<string>();\n    for (const group of activeReviewGroups) ids.add(group.questionId);\n    for (const issue of activeReviewTargetIssues) {\n      for (const issueTargetId of issue.targetIds) {\n        const target = draft.targets.find(\n          (candidate) => String(candidate.id) === String(issueTargetId),\n        );\n        const questionId = target ? questionIdForTarget(target, groups) : null;\n        if (questionId) ids.add(questionId);\n      }\n    }\n    return ids;\n  }, [activeReviewGroups, activeReviewTargetIssues, draft.targets, groups]);\n\n  const reloadGroups''',
          )
          replace(
              explorer,
              '''  useEffect(() => {\n    if (!loaded) return;\n    const timer = window.setTimeout(() => {\n      void saveTargetDraft(draft).catch''',
              '''  useEffect(() => {\n    setSourceTargetIssues(sourceReview?.targetIssues ?? []);\n    setSourceReviewOpen(false);\n  }, [sourceReview?.sourceRevisionId]);\n\n  useEffect(() => {\n    if (!loaded || !sourceReview) return;\n    const timer = window.setTimeout(() => {\n      void validateTargetDraft(draft)\n        .then((result) => setSourceTargetIssues(result.issues))\n        .catch(() => undefined);\n    }, 300);\n    return () => window.clearTimeout(timer);\n  }, [draft, loaded, sourceReview?.sourceRevisionId]);\n\n  useEffect(() => {\n    if (!loaded) return;\n    const timer = window.setTimeout(() => {\n      void saveTargetDraft(draft).catch''',
          )
          replace(
              explorer,
              '''  const navigateToIssue = (issue: TargetIssue) => {''',
              '''  const removeReviewTargets = (issue: TargetIssue) => {\n    const ids = new Set(issue.targetIds.map(String));\n    setDraft((current) => ({\n      ...current,\n      targets: current.targets.filter((target) => !ids.has(String(target.id))),\n    }));\n  };\n\n  const navigateToIssue = (issue: TargetIssue) => {''',
          )
          replace(
              explorer,
              '''            {profileBusy ? (\n              <span className="text-xs text-muted-foreground">분포 갱신 중…</span>\n            ) : null}''',
              '''            {sourceReviewCount > 0 ? (\n              <Button\n                type="button"\n                size="sm"\n                variant="outline"\n                className="h-8 text-destructive"\n                onClick={() => setSourceReviewOpen(true)}\n              >\n                확인 필요 {sourceReviewCount}\n              </Button>\n            ) : sourceReview ? (\n              <span className="text-xs text-muted-foreground">원본 업데이트 확인 완료</span>\n            ) : null}\n            {profileBusy ? (\n              <span className="text-xs text-muted-foreground">분포 갱신 중…</span>\n            ) : null}''',
          )
          replace(
              explorer,
              '''                {filteredQuestions.map((question) => {\n                  const count = targetCountFor(question.id);\n                  return (''',
              '''                {filteredQuestions.map((question) => {\n                  const count = targetCountFor(question.id);\n                  const needsReview = reviewQuestionIds.has(question.id);\n                  return (''',
          )
          replace(
              explorer,
              '''                      {count > 0 ? (\n                        <span className="shrink-0 text-xs font-normal text-muted-foreground">\n                          목표 {count}\n                        </span>\n                      ) : null}''',
              '''                      {needsReview || count > 0 ? (\n                        <span className="shrink-0 text-right text-xs font-normal">\n                          {needsReview ? (\n                            <span className="block text-destructive">확인 필요</span>\n                          ) : null}\n                          {count > 0 ? (\n                            <span className="block text-muted-foreground">목표 {count}</span>\n                          ) : null}\n                        </span>\n                      ) : null}''',
          )
          replace(
              explorer,
              '''                      busy={groupBusy}\n                      onOpenTarget={openTarget}''',
              '''                      busy={groupBusy}\n                      invalidGroupIds={sourceReview?.invalidValueGroupIds ?? []}\n                      onOpenTarget={openTarget}''',
          )
          replace(
              explorer,
              '''      <Dialog\n        open={deleteBlockedGroup !== null}''',
              '''      <Dialog open={sourceReviewOpen} onOpenChange={setSourceReviewOpen}>\n        <DialogContent className="sm:max-w-[640px]">\n          <DialogHeader>\n            <DialogTitle>원본 업데이트 후 확인이 필요합니다</DialogTitle>\n            <DialogDescription>\n              저장된 그룹과 목표를 자동으로 바꾸지 않았습니다. 필요한 항목만 직접 확인하거나\n              제거하세요.\n            </DialogDescription>\n          </DialogHeader>\n          <div className="divide-y">\n            {activeReviewGroups.map((group) => {\n              const question = questions.find((candidate) => candidate.id === group.questionId);\n              return (\n                <div key={group.id} className="flex items-center justify-between gap-4 py-3">\n                  <div className="min-w-0">\n                    <p className="truncate text-sm font-medium">그룹 · {group.name}</p>\n                    <p className="mt-1 text-xs text-muted-foreground">\n                      {question?.title ?? "원본에서 사라진 문항"}\n                    </p>\n                  </div>\n                  {question ? (\n                    <Button\n                      type="button"\n                      size="sm"\n                      variant="ghost"\n                      onClick={() => {\n                        setSelectedQuestionId(question.id);\n                        setWorkspaceView("setup");\n                        setSourceReviewOpen(false);\n                      }}\n                    >\n                      문항으로 이동\n                    </Button>\n                  ) : (\n                    <Button\n                      type="button"\n                      size="sm"\n                      variant="ghost"\n                      className="text-destructive"\n                      onClick={() => {\n                        setSourceReviewOpen(false);\n                        requestDeleteGroup(group);\n                      }}\n                    >\n                      그룹 삭제\n                    </Button>\n                  )}\n                </div>\n              );\n            })}\n            {activeReviewTargetIssues.map((issue, index) => {\n              const target = issue.targetIds\n                .map((issueTargetId) =>\n                  draft.targets.find(\n                    (candidate) => String(candidate.id) === String(issueTargetId),\n                  ),\n                )\n                .find((candidate) => candidate !== undefined);\n              const questionId = target ? questionIdForTarget(target, groups) : null;\n              const question = questionId\n                ? questions.find((candidate) => candidate.id === questionId)\n                : undefined;\n              return (\n                <div\n                  key={`${issue.code}-${index}`}\n                  className="flex items-start justify-between gap-4 py-3"\n                >\n                  <div className="min-w-0">\n                    <p className="text-sm font-medium">목표 설정</p>\n                    <p className="mt-1 text-xs text-muted-foreground">{issueMessage(issue)}</p>\n                  </div>\n                  <div className="flex shrink-0 items-center gap-1">\n                    {question ? (\n                      <Button\n                        type="button"\n                        size="sm"\n                        variant="ghost"\n                        onClick={() => {\n                          setSelectedQuestionId(question.id);\n                          setWorkspaceView("setup");\n                          setSourceReviewOpen(false);\n                        }}\n                      >\n                        문항으로 이동\n                      </Button>\n                    ) : null}\n                    {issue.targetIds.length > 0 ? (\n                      <Button\n                        type="button"\n                        size="sm"\n                        variant="ghost"\n                        className="text-destructive"\n                        onClick={() => removeReviewTargets(issue)}\n                      >\n                        목표 제거\n                      </Button>\n                    ) : null}\n                  </div>\n                </div>\n              );\n            })}\n          </div>\n          <DialogFooter>\n            <Button type="button" variant="outline" onClick={() => setSourceReviewOpen(false)}>\n              닫기\n            </Button>\n          </DialogFooter>\n        </DialogContent>\n      </Dialog>\n\n      <Dialog\n        open={deleteBlockedGroup !== null}''',
          )
          PY
      - name: Format source refresh workspace
        run: |
          pnpm exec prettier --write \
            apps/desktop/src/api/backend.ts \
            apps/desktop/src/AppShell.tsx \
            apps/desktop/src/QuestionExplorerPanel/index.tsx \
            apps/desktop/src/QuestionExplorerPanel/TextInspector.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- \
            apps/desktop/src/api/backend.ts \
            apps/desktop/src/AppShell.tsx \
            apps/desktop/src/QuestionExplorerPanel/index.tsx \
            apps/desktop/src/QuestionExplorerPanel/TextInspector.tsx; then
            git add \
              apps/desktop/src/api/backend.ts \
              apps/desktop/src/AppShell.tsx \
              apps/desktop/src/QuestionExplorerPanel/index.tsx \
              apps/desktop/src/QuestionExplorerPanel/TextInspector.tsx
            git commit -m "feat(ui): add explicit source refresh review"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
