name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - phase1-backend-target-contract

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Format question explorer
        run: |
          pnpm exec prettier --write "apps/desktop/src/QuestionExplorerPanel/*.{ts,tsx}"
          if ! git diff --quiet -- apps/desktop/src/QuestionExplorerPanel; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/desktop/src/QuestionExplorerPanel
            git commit -m "chore(ui): format question explorer"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test