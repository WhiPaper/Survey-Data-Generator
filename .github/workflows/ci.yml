name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - phase1-backend-target-contract

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/electron/main/synthesis/flat-table.ts")
          text = path.read_text()
          guard = "  if (!form.logic) return [];\n"
          if guard not in text:
              marker = "): CandidateRoutingRule[] => {\n"
              text = text.replace(marker, marker + guard, 1)
              path.write_text(text)
          PY
          pnpm exec prettier --write \
            apps/desktop/electron/main/synthesis/flat-table.ts \
            apps/desktop/test/correctness-regressions.test.ts \
            apps/desktop/test/flat-table.test.ts
          git diff -- \
            apps/desktop/electron/main/synthesis/flat-table.ts \
            apps/desktop/test/correctness-regressions.test.ts \
            apps/desktop/test/flat-table.test.ts
      - if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- \
            apps/desktop/electron/main/synthesis/flat-table.ts \
            apps/desktop/test/correctness-regressions.test.ts \
            apps/desktop/test/flat-table.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/desktop/electron/main/synthesis/flat-table.ts \
              apps/desktop/test/correctness-regressions.test.ts \
              apps/desktop/test/flat-table.test.ts
            git commit -m "Format routing validation follow-up"
            git push origin HEAD:phase1-backend-target-contract
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
