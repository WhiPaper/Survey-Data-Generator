name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - phase1-backend-target-contract

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Apply draft flush lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement in {path}: {old[:180]!r}")
              file.write_text(text.replace(old, new, 1))

          Path("apps/desktop/src/QuestionExplorerPanel/draftSaveCoordinator.ts").write_text('''import type { TargetDraft } from "@survey-synth/contracts";\n\ntype SaveTargetDraft = (draft: TargetDraft) => Promise<unknown>;\n\nconst serializeDraft = (draft: TargetDraft): string => JSON.stringify(draft);\n\nexport const createDraftSaveCoordinator = (save: SaveTargetDraft) => {\n  let latestDraft: TargetDraft | null = null;\n  let latestSerialized: string | null = null;\n  let persistedSerialized: string | null = null;\n  let activeFlush: Promise<void> | null = null;\n\n  const setLatest = (draft: TargetDraft, persisted = false): void => {\n    latestDraft = draft;\n    latestSerialized = serializeDraft(draft);\n    if (persisted) persistedSerialized = latestSerialized;\n  };\n\n  const runFlush = async (): Promise<void> => {\n    while (latestDraft && latestSerialized !== persistedSerialized) {\n      const draftToSave = latestDraft;\n      const serializedToSave = latestSerialized;\n      await save(draftToSave);\n      persistedSerialized = serializedToSave;\n    }\n  };\n\n  const flush = (): Promise<void> => {\n    if (activeFlush) {\n      return activeFlush.then(() =>\n        latestSerialized === persistedSerialized ? undefined : flush(),\n      );\n    }\n    const task = runFlush();\n    activeFlush = task;\n    return task.finally(() => {\n      if (activeFlush === task) activeFlush = null;\n    });\n  };\n\n  return {\n    setLatest,\n    flush,\n    hasPending: (): boolean =>\n      latestDraft !== null && latestSerialized !== persistedSerialized,\n  } as const;\n};\n''')

          Path("apps/desktop/electron/main/window-close-gate.ts").write_text('''export type WindowCloseDecision = "allow" | "prevent" | "prevent_and_request";\n\nexport const createWindowCloseGate = () => {\n  let rendererApproved = false;\n  let requestPending = false;\n\n  return {\n    requestClose(): WindowCloseDecision {\n      if (rendererApproved) {\n        rendererApproved = false;\n        return "allow";\n      }\n      if (requestPending) return "prevent";\n      requestPending = true;\n      return "prevent_and_request";\n    },\n    resolve(canClose: boolean): boolean {\n      requestPending = false;\n      if (!canClose) return false;\n      rendererApproved = true;\n      return true;\n    },\n  } as const;\n};\n''')

          Path("apps/desktop/test/draft-save-coordinator.test.ts").write_text('''import { describe, expect, it } from "vitest";\n\nimport type { TargetDraft } from "@survey-synth/contracts";\nimport { createDraftSaveCoordinator } from "../src/QuestionExplorerPanel/draftSaveCoordinator";\n\nconst draft = (finalCount: number): TargetDraft => ({\n  projectId: "project-1",\n  finalCount,\n  sourceScope: { kind: "all" },\n  seed: 42,\n  targets: [],\n});\n\ndescribe("Question Explorer draft save coordinator", () => {\n  it("skips a flush when the latest draft is already persisted", async () => {\n    const saves: TargetDraft[] = [];\n    const coordinator = createDraftSaveCoordinator(async (value) => {\n      saves.push(value);\n    });\n    coordinator.setLatest(draft(120), true);\n    await coordinator.flush();\n    expect(saves).toEqual([]);\n\n    coordinator.setLatest(draft(121));\n    await coordinator.flush();\n    await coordinator.flush();\n    expect(saves.map((value) => value.finalCount)).toEqual([121]);\n  });\n\n  it("continues to the newest draft when it changes during an active save", async () => {\n    const saves: number[] = [];\n    let releaseFirst: (() => void) | null = null;\n    const firstSave = new Promise<void>((resolve) => {\n      releaseFirst = resolve;\n    });\n    const coordinator = createDraftSaveCoordinator(async (value) => {\n      saves.push(value.finalCount ?? 0);\n      if (saves.length === 1) await firstSave;\n    });\n\n    coordinator.setLatest(draft(120));\n    const flushing = coordinator.flush();\n    await Promise.resolve();\n    coordinator.setLatest(draft(121));\n    releaseFirst?.();\n    await flushing;\n\n    expect(saves).toEqual([120, 121]);\n    expect(coordinator.hasPending()).toBe(false);\n  });\n\n  it("keeps a failed draft pending so a later flush can retry it", async () => {\n    let attempts = 0;\n    const coordinator = createDraftSaveCoordinator(async () => {\n      attempts += 1;\n      if (attempts === 1) throw new Error("save failed");\n    });\n    coordinator.setLatest(draft(120));\n\n    await expect(coordinator.flush()).rejects.toThrow("save failed");\n    expect(coordinator.hasPending()).toBe(true);\n    await coordinator.flush();\n    expect(attempts).toBe(2);\n    expect(coordinator.hasPending()).toBe(false);\n  });\n});\n''')

          Path("apps/desktop/test/window-close-gate.test.ts").write_text('''import { describe, expect, it } from "vitest";\n\nimport { createWindowCloseGate } from "../electron/main/window-close-gate";\n\ndescribe("desktop window close gate", () => {\n  it("requests one renderer flush and closes only after approval", () => {\n    const gate = createWindowCloseGate();\n    expect(gate.requestClose()).toBe("prevent_and_request");\n    expect(gate.requestClose()).toBe("prevent");\n    expect(gate.resolve(true)).toBe(true);\n    expect(gate.requestClose()).toBe("allow");\n    expect(gate.requestClose()).toBe("prevent_and_request");\n  });\n\n  it("keeps the window open when the renderer reports a save failure", () => {\n    const gate = createWindowCloseGate();\n    expect(gate.requestClose()).toBe("prevent_and_request");\n    expect(gate.resolve(false)).toBe(false);\n    expect(gate.requestClose()).toBe("prevent_and_request");\n  });\n});\n''')

          qep = "apps/desktop/src/QuestionExplorerPanel/index.tsx"
          replace(qep, 'import { useEffect, useMemo, useState } from "react";', 'import { useCallback, useEffect, useMemo, useState } from "react";')
          replace(qep, 'import { TextInspector } from "./TextInspector";\n', 'import { TextInspector } from "./TextInspector";\nimport { createDraftSaveCoordinator } from "./draftSaveCoordinator";\n')
          replace(
              qep,
              '''export function QuestionExplorerPanel({\n  project,\n  sourceReview,\n}: {\n  project: ProjectDetailView;\n  sourceReview?: ProjectSourceReviewResult | null;\n}) {''',
              '''export function QuestionExplorerPanel({\n  project,\n  sourceReview,\n  onDraftFlushReady,\n}: {\n  project: ProjectDetailView;\n  sourceReview?: ProjectSourceReviewResult | null;\n  onDraftFlushReady?: (flush: (() => Promise<void>) | null) => void;\n}) {''',
          )
          replace(
              qep,
              '''  const [message, setMessage] = useState<string | null>(null);\n  const [error, setError] = useState<string | null>(null);\n\n  const selectedQuestion =''',
              '''  const [message, setMessage] = useState<string | null>(null);\n  const [error, setError] = useState<string | null>(null);\n  const draftSaveCoordinator = useMemo(\n    () => createDraftSaveCoordinator(saveTargetDraft),\n    [project.id],\n  );\n\n  const selectedQuestion =''',
          )
          replace(
              qep,
              '''        setDraft(nextDraft);\n        setGroups(nextGroups);''',
              '''        draftSaveCoordinator.setLatest(nextDraft, saved !== null);\n        setDraft(nextDraft);\n        setGroups(nextGroups);''',
          )
          replace(
              qep,
              '''  }, [project.currentSourceRevisionId, project.id, project.responseCount]);''',
              '''  }, [\n    draftSaveCoordinator,\n    project.currentSourceRevisionId,\n    project.id,\n    project.responseCount,\n  ]);''',
          )
          replace(
              qep,
              '''  useEffect(() => {\n    if (!loaded) return;\n    const timer = window.setTimeout(() => {\n      void saveTargetDraft(draft).catch((cause: unknown) => {\n        setError(cause instanceof Error ? cause.message : "변경사항을 저장하지 못했습니다.");\n      });\n    }, 450);\n    return () => window.clearTimeout(timer);\n  }, [draft, loaded]);''',
              '''  useEffect(() => {\n    if (!loaded) return;\n    draftSaveCoordinator.setLatest(draft);\n    const timer = window.setTimeout(() => {\n      void draftSaveCoordinator.flush().catch((cause: unknown) => {\n        setError(cause instanceof Error ? cause.message : "변경사항을 저장하지 못했습니다.");\n      });\n    }, 450);\n    return () => window.clearTimeout(timer);\n  }, [draft, draftSaveCoordinator, loaded]);\n\n  const flushDraft = useCallback(async (): Promise<void> => {\n    if (!loaded) return;\n    draftSaveCoordinator.setLatest(draft);\n    await draftSaveCoordinator.flush();\n  }, [draft, draftSaveCoordinator, loaded]);\n\n  useEffect(() => {\n    onDraftFlushReady?.(flushDraft);\n    return () => onDraftFlushReady?.(null);\n  }, [flushDraft, onDraftFlushReady]);''',
          )
          replace(
              qep,
              '''        await saveTargetDraft(nextDraft);\n        migrated = true;''',
              '''        draftSaveCoordinator.setLatest(nextDraft);\n        try {\n          await draftSaveCoordinator.flush();\n        } catch (cause: unknown) {\n          draftSaveCoordinator.setLatest(draft);\n          throw cause;\n        }\n        migrated = true;''',
          )
          replace(qep, '      await saveTargetDraft(draft);\n      const result = await startTargetDraft', '      await flushDraft();\n      const result = await startTargetDraft')

          app = "apps/desktop/src/AppShell.tsx"
          replace(app, 'import { useEffect, useState } from "react";', 'import { useCallback, useEffect, useRef, useState } from "react";')
          replace(
              app,
              '''  const [importSummary, setImportSummary] = useState<FormImportResult | null>(null);\n  const [error, setError] = useState<string | null>(null);\n\n  useEffect(() => {''',
              '''  const [importSummary, setImportSummary] = useState<FormImportResult | null>(null);\n  const [error, setError] = useState<string | null>(null);\n  const activeDraftFlushRef = useRef<(() => Promise<void>) | null>(null);\n\n  const registerDraftFlush = useCallback((flush: (() => Promise<void>) | null): void => {\n    activeDraftFlushRef.current = flush;\n  }, []);\n\n  const flushActiveDraft = useCallback(async (): Promise<boolean> => {\n    const flush = activeDraftFlushRef.current;\n    if (!flush) return true;\n    try {\n      await flush();\n      return true;\n    } catch {\n      setError("변경사항을 저장하지 못했습니다. 다시 시도해주세요.");\n      return false;\n    }\n  }, []);\n\n  useEffect(\n    () =>\n      window.surveySynth.onBeforeClose(async () => {\n        const saved = await flushActiveDraft();\n        return saved;\n      }),\n    [flushActiveDraft],\n  );\n\n  useEffect(() => {''',
          )
          replace(
              app,
              '''    try {\n      await logout();\n      setSession(null);''',
              '''    try {\n      if (!(await flushActiveDraft())) return;\n      await logout();\n      setSession(null);''',
          )
          replace(
              app,
              '''    setRefreshBusy(true);\n    setError(null);\n    try {\n      const result = await refreshProjectSource''',
              '''    setRefreshBusy(true);\n    setError(null);\n    try {\n      if (!(await flushActiveDraft())) return;\n      const result = await refreshProjectSource''',
          )
          replace(
              app,
              '''  const handleDeleteProject = async (project: ProjectSummaryView): Promise<void> => {''',
              '''  const handleProjectChange = async (): Promise<void> => {\n    setProjectsBusy(true);\n    setError(null);\n    try {\n      if (!(await flushActiveDraft())) return;\n      setSelectedProject(null);\n      setSourceReview(null);\n    } finally {\n      setProjectsBusy(false);\n    }\n  };\n\n  const handleDeleteProject = async (project: ProjectSummaryView): Promise<void> => {''',
          )
          replace(
              app,
              '''              <Button size="sm" variant="outline" onClick={() => setSelectedProject(null)}>\n                프로젝트 변경\n              </Button>''',
              '''              <Button\n                size="sm"\n                variant="outline"\n                disabled={projectsBusy || refreshBusy}\n                onClick={() => void handleProjectChange()}\n              >\n                프로젝트 변경\n              </Button>''',
          )
          replace(
              app,
              '''          <QuestionExplorerPanel project={selectedProject} sourceReview={sourceReview} />''',
              '''          <QuestionExplorerPanel\n            project={selectedProject}\n            sourceReview={sourceReview}\n            onDraftFlushReady={registerDraftFlush}\n          />''',
          )

          preload = "apps/desktop/electron/preload/index.ts"
          replace(
              preload,
              '''const BACKEND_CALL_CHANNEL = "survey-synth:backend-call";''',
              '''const BACKEND_CALL_CHANNEL = "survey-synth:backend-call";\nconst WINDOW_CLOSE_REQUEST_CHANNEL = "survey-synth:window-close-request";\nconst WINDOW_CLOSE_RESPONSE_CHANNEL = "survey-synth:window-close-response";''',
          )
          replace(
              preload,
              '''contextBridge.exposeInMainWorld("surveySynth", { backendCall });''',
              '''const onBeforeClose = (listener: () => boolean | Promise<boolean>): (() => void) => {\n  const handler = (): void => {\n    void Promise.resolve()\n      .then(listener)\n      .then((canClose) => ipcRenderer.send(WINDOW_CLOSE_RESPONSE_CHANNEL, canClose === true))\n      .catch(() => ipcRenderer.send(WINDOW_CLOSE_RESPONSE_CHANNEL, false));\n  };\n  ipcRenderer.on(WINDOW_CLOSE_REQUEST_CHANNEL, handler);\n  return () => ipcRenderer.removeListener(WINDOW_CLOSE_REQUEST_CHANNEL, handler);\n};\n\ncontextBridge.exposeInMainWorld("surveySynth", { backendCall, onBeforeClose });''',
          )

          declaration = "apps/desktop/src/electron.d.ts"
          replace(
              declaration,
              '''      backendCall(request: string): Promise<unknown>;''',
              '''      backendCall(request: string): Promise<unknown>;\n      onBeforeClose(listener: () => boolean | Promise<boolean>): () => void;''',
          )

          main = "apps/desktop/electron/main/index.ts"
          replace(
              main,
              '''import { createValueGroupService } from "./value-groups/service";''',
              '''import { createValueGroupService } from "./value-groups/service";\nimport { createWindowCloseGate } from "./window-close-gate";''',
          )
          replace(
              main,
              '''const BACKEND_CALL_CHANNEL = "survey-synth:backend-call";\nconst packagedSmoke''',
              '''const BACKEND_CALL_CHANNEL = "survey-synth:backend-call";\nconst WINDOW_CLOSE_REQUEST_CHANNEL = "survey-synth:window-close-request";\nconst WINDOW_CLOSE_RESPONSE_CHANNEL = "survey-synth:window-close-response";\nconst closeGates = new WeakMap<BrowserWindow, ReturnType<typeof createWindowCloseGate>>();\nconst packagedSmoke''',
          )
          replace(
              main,
              '''  window.once("ready-to-show", () => window.show());\n  const devServerUrl''',
              '''  const closeGate = createWindowCloseGate();\n  closeGates.set(window, closeGate);\n  window.on("close", (event) => {\n    if (window.webContents.isDestroyed()) return;\n    const decision = closeGate.requestClose();\n    if (decision === "allow") return;\n    event.preventDefault();\n    if (decision === "prevent_and_request") {\n      window.webContents.send(WINDOW_CLOSE_REQUEST_CHANNEL);\n    }\n  });\n\n  window.once("ready-to-show", () => window.show());\n  const devServerUrl''',
          )
          replace(
              main,
              '''ipcMain.handle(BACKEND_CALL_CHANNEL, async (_event, serializedRequest: string) => {''',
              '''ipcMain.on(WINDOW_CLOSE_RESPONSE_CHANNEL, (event, canClose: unknown) => {\n  const window = BrowserWindow.fromWebContents(event.sender);\n  if (!window) return;\n  const closeGate = closeGates.get(window);\n  if (!closeGate) return;\n  if (closeGate.resolve(canClose === true) && !window.isDestroyed()) window.close();\n});\n\nipcMain.handle(BACKEND_CALL_CHANNEL, async (_event, serializedRequest: string) => {''',
          )
          PY
      - name: Format and commit draft flush lifecycle
        run: |
          pnpm exec prettier --write \
            apps/desktop/src/AppShell.tsx \
            apps/desktop/src/electron.d.ts \
            apps/desktop/src/QuestionExplorerPanel/index.tsx \
            apps/desktop/src/QuestionExplorerPanel/draftSaveCoordinator.ts \
            apps/desktop/electron/main/index.ts \
            apps/desktop/electron/main/window-close-gate.ts \
            apps/desktop/electron/preload/index.ts \
            apps/desktop/test/draft-save-coordinator.test.ts \
            apps/desktop/test/window-close-gate.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add \
              apps/desktop/src/AppShell.tsx \
              apps/desktop/src/electron.d.ts \
              apps/desktop/src/QuestionExplorerPanel/index.tsx \
              apps/desktop/src/QuestionExplorerPanel/draftSaveCoordinator.ts \
              apps/desktop/electron/main/index.ts \
              apps/desktop/electron/main/window-close-gate.ts \
              apps/desktop/electron/preload/index.ts \
              apps/desktop/test/draft-save-coordinator.test.ts \
              apps/desktop/test/window-close-gate.test.ts
            git commit -m "fix(ui): flush active draft before lifecycle transitions"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
