name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - phase1-backend-target-contract

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Fix frozen Run subject narrowing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src/QuestionExplorerPanel/ResultView.tsx")
          text = path.read_text()
          old = '''  if (target.subject.kind === "value_group") return target.subject.valueGroup.name;
  const question = questions.find((candidate) => candidate.id === target.subject.questionId);
  return (
    question?.options.find((option) => option.key === target.subject.optionKey)?.label ?? "선택지"
  );'''
          new = '''  const subject = target.subject;
  if (subject.kind === "value_group") return subject.valueGroup.name;
  const question = questions.find((candidate) => candidate.id === subject.questionId);
  return question?.options.find((option) => option.key === subject.optionKey)?.label ?? "선택지";'''
          if old not in text:
              raise SystemExit("frozen target label narrowing block not found")
          text = text.replace(old, new, 1)
          old = '''  return target.subject.kind === "value_group"
    ? target.subject.valueGroup.questionId
    : target.subject.questionId;'''
          new = '''  const subject = target.subject;
  return subject.kind === "value_group" ? subject.valueGroup.questionId : subject.questionId;'''
          if old not in text:
              raise SystemExit("frozen question id narrowing block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format frozen Run fix
        run: |
          pnpm exec prettier --write apps/desktop/src/QuestionExplorerPanel/ResultView.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- apps/desktop/src/QuestionExplorerPanel/ResultView.tsx; then
            git add apps/desktop/src/QuestionExplorerPanel/ResultView.tsx
            git commit -m "fix(ui): narrow frozen run subjects"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
