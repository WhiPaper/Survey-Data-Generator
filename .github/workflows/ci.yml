name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - phase1-backend-target-contract

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Align existing RunsGetResult fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/contracts/test/protocol.test.ts")
          text = path.read_text()
          old = '''        outcome,\n        validation: {},\n        finalResponseCount: 120,'''
          new = '''        outcome,\n        diagnostics: {\n          sourceResponseCount: 80,\n          syntheticResponseCount: 40,\n          replacementCount: 0,\n          structuralValidation: "passed",\n        },\n        validation: {},\n        finalResponseCount: 120,'''
          if old not in text:
              raise SystemExit("RunsGetResult fixture anchor missing")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and commit fixture
        run: |
          pnpm exec prettier --write packages/contracts/test/protocol.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add packages/contracts/test/protocol.test.ts
            git commit -m "test(contracts): align Run diagnostics fixture"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
