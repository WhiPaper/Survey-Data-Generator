name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Fix historical baseline contract fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/contracts/test/protocol.test.ts")
          text = path.read_text()
          old = '''      baselines: [{ targetId: "t-mean", kind: "mean", mean: 4.1, denominatorCount: 80 }],\n'''
          new = '''      baselines: [\n        { targetId: "t-mean", kind: "mean", mean: 4.1, denominatorCount: 80 },\n        {\n          targetId: "t-share",\n          kind: "share",\n          count: 28,\n          denominatorCount: 80,\n          share: 0.35,\n        },\n        {\n          targetId: "t-conditional",\n          kind: "conditional_share",\n          count: 12,\n          denominatorCount: 20,\n          share: 0.6,\n        },\n      ],\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one baseline assertion, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/contracts/test/protocol.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/contracts/test/protocol.test.ts
            git commit -m "test(result): cover all frozen target baselines"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
