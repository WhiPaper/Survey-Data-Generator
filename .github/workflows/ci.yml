name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - phase1-backend-target-contract

permissions:
  contents: write

jobs:
  repair-and-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-backend-target-contract
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Repair target outcome typing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/electron/main/synthesis/service.ts")
          text = path.read_text(encoding="utf-8")
          old = 'targets: targets.flatMap((target) => {'
          new = 'targets: targets.flatMap<TargetSetOutcome["targets"][number]>((target) => {'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("targetSetOutcome flatMap site was not found")
          path.write_text(text, encoding="utf-8")
          PY
      - run: >-
          pnpm exec prettier --write
          apps/desktop/electron/main/synthesis/service.ts
          apps/desktop/electron/main/targets/service.ts
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
      - name: Restore normal CI workflow
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: ci

          on:
            pull_request:
            push:
              branches:
                - main
                - phase1-backend-target-contract

          permissions:
            contents: read

          jobs:
            check:
              runs-on: ubuntu-22.04
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 11.19.0
                - uses: actions/setup-node@v4
                  with:
                    node-version-file: .node-version
                    cache: pnpm
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - run: pnpm install --frozen-lockfile
                - run: pnpm run check
                - run: python -m pip install -r engine/requirements.txt
                - run: pnpm run engine:test
          EOF
      - name: Commit validated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/electron/main/synthesis/service.ts apps/desktop/electron/main/targets/service.ts .github/workflows/ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: validate target contract semantics"
          git push origin HEAD:phase1-backend-target-contract
