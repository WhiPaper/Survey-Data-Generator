name: ci-run-historical-intent

on:
  pull_request:

permissions:
  contents: write

jobs:
  wire-and-check:
    if: github.head_ref == 'backend/run-historical-intent'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Wire frozen target intents
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))

          protocol = Path("packages/contracts/src/protocol.ts")
          replace_once(
              protocol,
              '''export const SynthesisStartParamsSchema = z\n  .object({\n''',
              '''export const SynthesisTargetIntentSnapshotSchema = z\n  .object({\n    targetId: TargetIdSchema,\n    intent: TargetIntentSchema,\n  })\n  .strict();\nexport type SynthesisTargetIntentSnapshot = z.infer<typeof SynthesisTargetIntentSnapshotSchema>;\n\nexport const SynthesisStartParamsSchema = z\n  .object({\n''',
          )
          replace_once(
              protocol,
              '''    targets: z.array(SynthesisTargetSchema).min(1),\n    sourceScope: SourceScopeSchema.optional(),\n''',
              '''    targets: z.array(SynthesisTargetSchema).min(1),\n    targetIntents: z.array(SynthesisTargetIntentSnapshotSchema).optional(),\n    sourceScope: SourceScopeSchema.optional(),\n''',
          )
          replace_once(
              protocol,
              '''  .superRefine((value, context) => {\n    const seen = new Set<string>();\n    value.targets.forEach((target, index) => {\n      const id = String(target.id);\n      if (seen.has(id)) {\n        context.addIssue({\n          code: z.ZodIssueCode.custom,\n          path: ["targets", index, "id"],\n          message: "TargetId must be unique within a Run",\n        });\n      }\n      seen.add(id);\n    });\n  });\n''',
              '''  .superRefine((value, context) => {\n    const targetIds = new Set<string>();\n    value.targets.forEach((target, index) => {\n      const id = String(target.id);\n      if (targetIds.has(id)) {\n        context.addIssue({\n          code: z.ZodIssueCode.custom,\n          path: ["targets", index, "id"],\n          message: "TargetId must be unique within a Run",\n        });\n      }\n      targetIds.add(id);\n    });\n\n    const intentIds = new Set<string>();\n    value.targetIntents?.forEach((entry, index) => {\n      const id = String(entry.targetId);\n      if (intentIds.has(id)) {\n        context.addIssue({\n          code: z.ZodIssueCode.custom,\n          path: ["targetIntents", index, "targetId"],\n          message: "Target intent metadata must be unique by TargetId",\n        });\n      }\n      intentIds.add(id);\n\n      const target = value.targets.find((candidate) => String(candidate.id) === id);\n      if (!target) {\n        context.addIssue({\n          code: z.ZodIssueCode.custom,\n          path: ["targetIntents", index, "targetId"],\n          message: "Target intent metadata must reference a target in this Run",\n        });\n        return;\n      }\n\n      const intentKind = entry.intent.kind;\n      const supported =\n        target.kind === "count"\n          ? intentKind === "absolute" || intentKind === "count_delta"\n          : target.kind === "mean"\n            ? intentKind === "absolute"\n            : intentKind === "absolute" ||\n              intentKind === "percentage_point_delta" ||\n              intentKind === "relative_percent_delta";\n      if (!supported) {\n        context.addIssue({\n          code: z.ZodIssueCode.custom,\n          path: ["targetIntents", index, "intent", "kind"],\n          message: "Target intent metadata is not valid for this target kind",\n        });\n      }\n    });\n  });\n''',
          )
          replace_once(
              protocol,
              '''      subject: FrozenTargetSubjectSchema,\n      value: z.number().int().nonnegative(),\n''',
              '''      subject: FrozenTargetSubjectSchema,\n      intent: TargetIntentSchema.optional(),\n      value: z.number().int().nonnegative(),\n''',
          )
          replace_once(
              protocol,
              '''      subject: FrozenTargetSubjectSchema,\n      value: z.number().min(0).max(1),\n''',
              '''      subject: FrozenTargetSubjectSchema,\n      intent: TargetIntentSchema.optional(),\n      value: z.number().min(0).max(1),\n''',
          )
          replace_once(
              protocol,
              '''  MeanTargetSchema,\n  z\n    .object({\n      id: TargetIdSchema,\n      kind: z.literal("conditional_share"),\n      value: z.number().min(0).max(1),\n''',
              '''  MeanTargetSchema.extend({ intent: TargetIntentSchema.optional() }).strict(),\n  z\n    .object({\n      id: TargetIdSchema,\n      kind: z.literal("conditional_share"),\n      value: z.number().min(0).max(1),\n      intent: TargetIntentSchema.optional(),\n''',
          )

          targets_service = Path("apps/desktop/electron/main/targets/service.ts")
          replace_once(
              targets_service,
              '''      targets: resolved,\n      sourceScope: context.sourceScope,\n''',
              '''      targets: resolved,\n      targetIntents: draft.targets.flatMap((target) =>\n        target.intent ? [{ targetId: target.id, intent: target.intent }] : [],\n      ),\n      sourceScope: context.sourceScope,\n''',
          )

          synthesis = Path("apps/desktop/electron/main/synthesis/service.ts")
          replace_once(
              synthesis,
              '''      const conditionals = params.targets.filter((target) => target.kind === "conditional_share");\n\n      const directOptionTargets = [...counts, ...shares].filter(\n''',
              '''      const conditionals = params.targets.filter((target) => target.kind === "conditional_share");\n      const intentByTargetId = new Map(\n        (params.targetIntents ?? []).map(({ targetId, intent }) => [String(targetId), intent] as const),\n      );\n      const frozenIntentFor = (targetId: unknown) => {\n        const intent = intentByTargetId.get(String(targetId));\n        return intent ? { intent } : {};\n      };\n\n      const directOptionTargets = [...counts, ...shares].filter(\n''',
          )
          replace_once(
              synthesis,
              '''      const frozenTargets: FrozenRunTarget[] = [...means];\n''',
              '''      const frozenTargets: FrozenRunTarget[] = means.map((mean) => ({\n        ...mean,\n        ...frozenIntentFor(mean.id),\n      }));\n''',
          )
          replace_once(
              synthesis,
              '''          subject: frozenSubject,\n          value: share.value,\n        });\n''',
              '''          subject: frozenSubject,\n          value: share.value,\n          ...frozenIntentFor(share.id),\n        });\n''',
          )
          replace_once(
              synthesis,
              '''          questionId: checkbox.id,\n          optionKey: target.optionKey,\n        });\n''',
              '''          questionId: checkbox.id,\n          optionKey: target.optionKey,\n          ...frozenIntentFor(target.id),\n        });\n''',
          )

          result_view = Path("apps/desktop/src/QuestionExplorerPanel/ResultView.tsx")
          replace_once(
              result_view,
              '''import type {\n  RunSummary,\n  RunsGetResult,\n  TargetDraft,\n  TargetProfileResult,\n  ValueGroupView,\n} from "@survey-synth/contracts";\n''',
              '''import type { RunSummary, RunsGetResult } from "@survey-synth/contracts";\n''',
          )
          replace_once(
              result_view,
              '''import { runPresentationLabel } from "./runPresentation";\nimport { intentLabel, outcomeValue, type QuestionView } from "./model";\n''',
              '''import { runIntentLabel } from "./runIntent";\nimport { runPresentationLabel } from "./runPresentation";\nimport { outcomeValue, type QuestionView } from "./model";\n''',
          )
          replace_once(
              result_view,
              '''export type RunContext = {\n  run: RunsGetResult;\n  draft: TargetDraft | null;\n  profile: TargetProfileResult | null;\n};\n''',
              '''export type RunContext = {\n  run: RunsGetResult;\n};\n''',
          )
          replace_once(
              result_view,
              '''  selectedRunId: string;\n  questions: QuestionView[];\n  groups: ValueGroupView[];\n  exportBusy: boolean;\n''',
              '''  selectedRunId: string;\n  questions: QuestionView[];\n  exportBusy: boolean;\n''',
          )
          replace_once(
              result_view,
              '''          const presentation = context.run.presentations.find(\n            (candidate) => String(candidate.targetId) === String(outcome.targetId),\n          );\n          const label = runPresentationLabel(presentation);\n''',
              '''          const presentation = context.run.presentations.find(\n            (candidate) => String(candidate.targetId) === String(outcome.targetId),\n          );\n          const frozenTarget = context.run.targetSnapshot.targets.find(\n            (candidate) => String(candidate.id) === String(outcome.targetId),\n          );\n          const label = runPresentationLabel(presentation);\n''',
          )
          replace_once(
              result_view,
              '''                현재 {runBaselineValue(baseline)} → {intentLabel(undefined, outcome)} → 결과{" "}\n''',
              '''                현재 {runBaselineValue(baseline)} → {runIntentLabel(frozenTarget?.intent, outcome)} → 결과{" "}\n''',
          )

          explorer = Path("apps/desktop/src/QuestionExplorerPanel/index.tsx")
          replace_once(
              explorer,
              '''        { run, draft: null, profile: null },\n''',
              '''        { run },\n''',
          )
          replace_once(
              explorer,
              '''      { run, draft, profile },\n''',
              '''      { run },\n''',
          )
          replace_once(
              explorer,
              '''          questions={questions}\n          groups={groups}\n          exportBusy={exportBusy}\n''',
              '''          questions={questions}\n          exportBusy={exportBusy}\n''',
          )

          phase4 = Path("apps/desktop/test/phase4-targets.test.ts")
          replace_once(
              phase4,
              '''    expect(captured?.targets).toEqual(\n      expect.arrayContaining([\n        expect.objectContaining({ id: "t-share", kind: "share", value: 0.55 }),\n        expect.objectContaining({ id: "t-count", kind: "count", value: 2 }),\n        expect.objectContaining({ id: "t-mean", kind: "mean", value: 4.3 }),\n      ]),\n    );\n''',
              '''    expect(captured?.targets).toEqual(\n      expect.arrayContaining([\n        expect.objectContaining({ id: "t-share", kind: "share", value: 0.55 }),\n        expect.objectContaining({ id: "t-count", kind: "count", value: 2 }),\n        expect.objectContaining({ id: "t-mean", kind: "mean", value: 4.3 }),\n      ]),\n    );\n    expect(captured?.targetIntents).toEqual([\n      { targetId: "t-share", intent: { kind: "relative_percent_delta", value: 0.1 } },\n      { targetId: "t-count", intent: { kind: "count_delta", value: 1 } },\n      { targetId: "t-mean", intent: { kind: "absolute", value: 4.3 } },\n    ]);\n''',
          )
          replace_once(
              phase4,
              '''    expect(captured?.targets).toEqual(\n      expect.arrayContaining([expect.objectContaining({ kind: "share", value: 0.9 })]),\n    );\n''',
              '''    expect(captured?.targets).toEqual(\n      expect.arrayContaining([expect.objectContaining({ kind: "share", value: 0.9 })]),\n    );\n    expect(captured?.targetIntents).toEqual(\n      expect.arrayContaining([\n        { targetId: "t-share", intent: { kind: "percentage_point_delta", value: -0.1 } },\n      ]),\n    );\n''',
          )

          m7 = Path("apps/desktop/test/m7-synthesis-service.test.ts")
          replace_once(
              m7,
              '''    targets: [{ id: "t-mean" as never, kind: "mean", questionId: "q-score", value: 3 }],\n    sourceScope: { kind: "all" },\n''',
              '''    targets: [{ id: "t-mean" as never, kind: "mean", questionId: "q-score", value: 3 }],\n    targetIntents: [\n      { targetId: "t-mean" as never, intent: { kind: "absolute", value: 3 } },\n    ],\n    sourceScope: { kind: "all" },\n''',
          )
          replace_once(
              m7,
              '''    expect(run.targetSnapshot.editPlan?.replacementCount).toBe(1);\n''',
              '''    expect(run.targetSnapshot.editPlan?.replacementCount).toBe(1);\n    expect(run.targetSnapshot.targets[0]).toMatchObject({\n      id: "t-mean",\n      intent: { kind: "absolute", value: 3 },\n    });\n''',
          )

          protocol_test = Path("packages/contracts/test/protocol.test.ts")
          replace_once(
              protocol_test,
              '''          ],\n          seed: 42,\n        },\n      }),\n    ).toMatchObject({ method: "synthesis.start" });\n  });\n\n  it("requires stable unique TargetIds", () => {\n''',
              '''          ],\n          targetIntents: [\n            {\n              targetId: "t-share-option",\n              intent: { kind: "relative_percent_delta", value: 0.2 },\n            },\n          ],\n          seed: 42,\n        },\n      }),\n    ).toMatchObject({\n      method: "synthesis.start",\n      params: {\n        targetIntents: [\n          {\n            targetId: "t-share-option",\n            intent: { kind: "relative_percent_delta", value: 0.2 },\n          },\n        ],\n      },\n    });\n  });\n\n  it("rejects target intent metadata for an unknown TargetId", () => {\n    expect(() =>\n      parseRpcRequest({\n        v: VERSIONS.protocolVersion,\n        type: "request",\n        id: "unknown-target-intent",\n        method: "synthesis.start",\n        params: {\n          projectId: "project-1",\n          finalCount: 120,\n          targets: [{ id: "t-mean", kind: "mean", questionId: "q-score", value: 4.3 }],\n          targetIntents: [\n            { targetId: "missing", intent: { kind: "absolute", value: 4.3 } },\n          ],\n          seed: 42,\n        },\n      }),\n    ).toThrow(/must reference a target/);\n  });\n\n  it("requires stable unique TargetIds", () => {\n''',
          )
          replace_once(
              protocol_test,
              '''              id: "t-share",\n              kind: "share",\n              value: 0.35,\n              subject: {\n''',
              '''              id: "t-share",\n              kind: "share",\n              value: 0.35,\n              intent: { kind: "relative_percent_delta", value: 0.2 },\n              subject: {\n''',
          )
          replace_once(
              protocol_test,
              '''      finalResponseCount: 120,\n      outcome: { targets: [{ targetId: "t-mean" }] },\n''',
              '''      finalResponseCount: 120,\n      targetSnapshot: {\n        targets: expect.arrayContaining([\n          expect.objectContaining({\n            id: "t-share",\n            intent: { kind: "relative_percent_delta", value: 0.2 },\n          }),\n        ]),\n      },\n      outcome: { targets: [{ targetId: "t-mean" }] },\n''',
          )

          PY
          pnpm exec prettier --write \
            packages/contracts/src/protocol.ts \
            packages/contracts/test/protocol.test.ts \
            apps/desktop/electron/main/targets/service.ts \
            apps/desktop/electron/main/synthesis/service.ts \
            apps/desktop/src/QuestionExplorerPanel/ResultView.tsx \
            apps/desktop/src/QuestionExplorerPanel/index.tsx \
            apps/desktop/src/QuestionExplorerPanel/runIntent.ts \
            apps/desktop/test/phase4-targets.test.ts \
            apps/desktop/test/m7-synthesis-service.test.ts \
            apps/desktop/test/run-intent-renderer.test.ts \
            docs/contracts/08_QUESTION_EXPLORER_PROFILE_AND_RUNS.md
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              packages/contracts/src/protocol.ts \
              packages/contracts/test/protocol.test.ts \
              apps/desktop/electron/main/targets/service.ts \
              apps/desktop/electron/main/synthesis/service.ts \
              apps/desktop/src/QuestionExplorerPanel/ResultView.tsx \
              apps/desktop/src/QuestionExplorerPanel/index.tsx \
              apps/desktop/src/QuestionExplorerPanel/runIntent.ts \
              apps/desktop/test/phase4-targets.test.ts \
              apps/desktop/test/m7-synthesis-service.test.ts \
              apps/desktop/test/run-intent-renderer.test.ts \
              docs/contracts/08_QUESTION_EXPLORER_PROFILE_AND_RUNS.md
            git commit -m "feat(runs): preserve historical target intent"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
