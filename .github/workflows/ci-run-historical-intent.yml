name: ci-run-historical-intent

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-and-check:
    if: github.head_ref == 'backend/run-historical-intent'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Fix contract assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/contracts/test/protocol.test.ts")
          text = path.read_text()
          old = '''      targetSnapshot: {\n        targets: expect.arrayContaining([\n          expect.objectContaining({\n            id: "t-share",\n            intent: { kind: "relative_percent_delta", value: 0.2 },\n          }),\n        ]),\n      },\n'''
          new = '''      targetSnapshot: {\n        targets: expect.arrayContaining([\n          expect.objectContaining({\n            id: "t-share",\n            intent: { kind: "relative_percent_delta", value: 0.2 },\n          }),\n        ]),\n        editPlan: { replacementCount: 1 },\n      },\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one primary targetSnapshot assertion, found {text.count(old)}")
          text = text.replace(old, new, 1)
          duplicate = '      targetSnapshot: { editPlan: { replacementCount: 1 } },\n'
          if text.count(duplicate) != 1:
              raise SystemExit(f"expected one duplicate targetSnapshot assertion, found {text.count(duplicate)}")
          path.write_text(text.replace(duplicate, '', 1))
          PY
          pnpm exec prettier --write packages/contracts/test/protocol.test.ts
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add packages/contracts/test/protocol.test.ts
            git commit -m "test(contracts): assert frozen run intent"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
