name: ci-question-denominator-copy

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-and-check:
    if: github.head_ref == 'ui/question-denominator-copy'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Remove obsolete import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src/QuestionExplorerPanel/index.tsx')
          text = path.read_text()
          old = '  kindLabel,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one kindLabel import, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1))
          PY
          pnpm exec prettier --write apps/desktop/src/QuestionExplorerPanel/index.tsx
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/desktop/src/QuestionExplorerPanel/index.tsx
            git commit -m "fix(ui): remove obsolete question label import"
            git push origin HEAD:ui/question-denominator-copy
          fi
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
