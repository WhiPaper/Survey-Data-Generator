name: unused-ui-cleanup-implementation

on:
  workflow_dispatch:
  push:
    branches:
      - cleanup/unused-ui-primitives-current
    paths:
      - .github/workflows/unused-ui-cleanup-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/unused-ui-primitives-current
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/unused_ui_cleanup_patch.py
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: python -m pip install -r engine/requirements.txt
      - run: pnpm run engine:test
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/desktop/package.json apps/desktop/src/components/ui apps/desktop/src/hooks/use-mobile.ts pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
          else
            git commit -m "chore: remove unused ui primitives"
            git push origin HEAD:cleanup/unused-ui-primitives-current
          fi
